name: Chromium i686 staged build attempt
description: Runs one resumable Chromium i686 compiler slice and publishes a stable checkpoint.
inputs:
  stage:
    description: Stage number.
    required: true
  attempt:
    description: Attempt label, such as primary or retry.
    required: true
  version:
    description: Chromium version.
    required: true
  preferred-checkpoint-artifact:
    description: First checkpoint artifact to try.
    required: false
    default: ""
  preferred-checkpoint-run-id:
    description: Run ID containing the preferred checkpoint.
    required: false
    default: ""
  fallback-checkpoint-artifact:
    description: Checkpoint artifact to use when the preferred artifact is unavailable.
    required: false
    default: ""
  fallback-checkpoint-run-id:
    description: Checkpoint run ID containing the fallback checkpoint.
    required: false
    default: ""
  final-stage:
    description: Fail after checkpointing when this is the final allowed stage and the build is incomplete.
    required: false
    default: "false"
outputs:
  complete:
    description: Whether Chromium finished compiling.
    value: ${{ steps.compile.outputs.complete }}
  failure_class:
    description: Classified failure type used to decide whether a fresh runner retry is useful.
    value: ${{ steps.recovery_artifact_failure.outputs.failure_class || steps.checkpoint_artifact_failure.outputs.failure_class || steps.compile.outputs.failure_class || steps.prepare.outputs.failure_class || steps.runtime.outputs.failure_class || steps.system_dependencies.outputs.failure_class || steps.runner_setup.outputs.failure_class || steps.job_start.outputs.failure_class || steps.package.outputs.failure_class || steps.final_recovery.outputs.failure_class || steps.checkpoint.outputs.failure_class }}

runs:
  using: composite
  steps:
    - name: Mark Job Start
      id: job_start
      shell: bash
      run: |
        if ! printf 'JOB_STARTED_AT=%s\n' "$(date +%s)" >> "${GITHUB_ENV}"; then
          echo "failure_class=infrastructure" >> "${GITHUB_OUTPUT}"
          exit 1
        fi

    - name: Log Initial Runner Storage
      shell: bash
      run: |
        source .github/scripts/runner_diagnostics.sh
        log_runner_storage "stage-${{ inputs.stage }}-${{ inputs.attempt }} initial" || true

    - name: Maximize Runner Disk Space
      id: runner_setup
      shell: bash
      run: |
        source .github/scripts/chromium_i686_common.sh
        if ! maximize_runner_disk_space; then
          echo "failure_class=infrastructure" >> "${GITHUB_OUTPUT}"
          exit 1
        fi

    - name: Log Storage After Cleanup
      shell: bash
      run: |
        source .github/scripts/runner_diagnostics.sh
        log_runner_storage "stage-${{ inputs.stage }}-${{ inputs.attempt }} after cleanup" || true

    - name: Install System Dependencies
      id: system_dependencies
      shell: bash
      run: |
        source .github/scripts/chromium_i686_common.sh
        if ! install_system_dependencies; then
          echo "failure_class=${SYSTEM_DEPENDENCY_FAILURE_CLASS:-infrastructure}" >> "${GITHUB_OUTPUT}"
          exit 1
        fi

    - name: Install i386 Runtime Libraries
      id: runtime
      shell: bash
      run: |
        source .github/scripts/chromium_i686_common.sh
        if ! install_i386_runtime_libraries; then
          echo "failure_class=${I386_RUNTIME_REPAIR_FAILURE_CLASS:-infrastructure}" >> "${GITHUB_OUTPUT}"
          exit 1
        fi

    - name: Resolve authoritative Chromium source cache identity
      id: source_cache_identity
      shell: bash
      run: |
        set -u -o pipefail
        metadata="${RUNNER_TEMP}/chromium-${{ inputs.version }}-source-object.json"
        stderr_file="${RUNNER_TEMP}/chromium-source-cache-identity.stderr"
        rm -f "${metadata}" "${stderr_file}"
        if cache_key="$(python3 scripts/chromium_source_object.py \
            --version "${{ inputs.version }}" \
            --metadata-out "${metadata}" \
            --cache-key-only 2>"${stderr_file}")"; then
          echo "resolved=true" >> "${GITHUB_OUTPUT}"
          echo "cache_key=${cache_key}" >> "${GITHUB_OUTPUT}"
          echo "Authoritative source cache identity: ${cache_key}"
        else
          echo "::warning::Could not resolve authoritative source cache identity before restore; skipping cache and letting source preparation retry normally."
          cat "${stderr_file}" >&2 || true
          echo "resolved=false" >> "${GITHUB_OUTPUT}"
          echo "cache_key=" >> "${GITHUB_OUTPUT}"
        fi

    - name: Restore Chromium source tarball cache
      id: source_cache
      if: ${{ steps.source_cache_identity.outputs.resolved == 'true' }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      continue-on-error: true
      with:
        path: ${{ github.workspace }}/.chromium-source-cache
        key: ${{ steps.source_cache_identity.outputs.cache_key }}
        restore-keys: |
          chromium-src-v3-${{ inputs.version }}
          chromium-src-v2-${{ inputs.version }}
          chromium-src-${{ inputs.version }}

    - name: Prepare Chromium Source
      id: prepare
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        source .github/scripts/chromium_i686_common.sh
        source .github/scripts/chromium_i686_resume.sh
        source .github/scripts/runner_diagnostics.sh

        fail_prepare_step() {
          local failure_class="${1:-infrastructure}"
          echo "failure_class=${failure_class}" >> "${GITHUB_OUTPUT}"
          exit 1
        }

        if ! prepare_chromium_source "${{ inputs.version }}"; then
          fail_prepare_step "${CHROMIUM_SOURCE_FAILURE_CLASS:-infrastructure}"
        fi
        if ! install_depot_tools; then
          fail_prepare_step "${CHROMIUM_PREPARE_FAILURE_CLASS:-infrastructure}"
        fi
        if ! install_chromium_clang; then
          fail_prepare_step "${CHROMIUM_PREPARE_FAILURE_CLASS:-infrastructure}"
        fi
        if ! install_i386_sysroot; then
          fail_prepare_step "${CHROMIUM_PREPARE_FAILURE_CLASS:-infrastructure}"
        fi
        if ! patch_build_gn_for_x86_linux; then
          fail_prepare_step "${CHROMIUM_PREPARE_FAILURE_CLASS:-deterministic_build}"
        fi
        if ! write_lastchange; then
          fail_prepare_step "${CHROMIUM_PREPARE_FAILURE_CLASS:-infrastructure}"
        fi
        if ! configure_ccache; then
          fail_prepare_step "${CHROMIUM_PREPARE_FAILURE_CLASS:-infrastructure}"
        fi
        if ! install_gn_from_cipd; then
          fail_prepare_step "${CHROMIUM_PREPARE_FAILURE_CLASS:-infrastructure}"
        fi
        if ! normalize_chromium_resume_inputs; then
          fail_prepare_step "${CHROMIUM_PREPARE_FAILURE_CLASS:-infrastructure}"
        fi

        checkpoint_restored=false
        resume_archive=""
        resume_producer_sha=""
        resume_producer_stage=""
        resume_producer_run_id=""
        resume_producer_run_attempt=""

        if [ -n "${{ inputs.preferred-checkpoint-artifact }}" ]; then
          preferred_rc=0
          validate_checkpoint_source_run \
            "${{ inputs.preferred-checkpoint-run-id }}" \
            "${{ inputs.version }}" \
            "${{ inputs.stage }}" \
            "${{ inputs.preferred-checkpoint-artifact }}" || preferred_rc=$?
          if [ "${preferred_rc}" -eq 0 ]; then
            preferred_sha="${CHECKPOINT_PRODUCER_SHA}"
            preferred_stage="${CHECKPOINT_PRODUCER_STAGE}"
            preferred_run_attempt="${CHECKPOINT_PRODUCER_RUN_ATTEMPT}"
            echo "Preferred checkpoint provenance accepted; downloading trusted artifact on demand."
            if ! mkdir -p "${GITHUB_WORKSPACE}/resume/preferred"; then
              fail_prepare_step infrastructure
            fi
            if bounded_gh run download "${{ inputs.preferred-checkpoint-run-id }}" \
              --repo "${GITHUB_REPOSITORY}" \
              --name "${{ inputs.preferred-checkpoint-artifact }}" \
              --dir "${GITHUB_WORKSPACE}/resume/preferred"; then
              preferred_candidate="${GITHUB_WORKSPACE}/resume/preferred/out-Release_x86.tar.zst"
              preferred_bundle_rc=1
              if [ -s "${preferred_candidate}" ]; then
                preferred_bundle_rc=0
                checkpoint_bundle_is_usable \
                  "${preferred_candidate}" "${{ inputs.version }}" "${{ inputs.stage }}" \
                  "${preferred_sha}" "${preferred_stage}" "${{ inputs.preferred-checkpoint-run-id }}" \
                  "${preferred_run_attempt}" || preferred_bundle_rc=$?
              fi
              if [ "${preferred_bundle_rc}" -eq 0 ]; then
                resume_archive="${preferred_candidate}"
                resume_producer_sha="${preferred_sha}"
                resume_producer_stage="${preferred_stage}"
                resume_producer_run_id="${{ inputs.preferred-checkpoint-run-id }}"
                resume_producer_run_attempt="${preferred_run_attempt}"
              elif [ "${CHECKPOINT_BUNDLE_FAILURE_CLASS:-deterministic_build}" = infrastructure ]; then
                echo "::error::Preferred checkpoint validation failed due to runner/tool infrastructure; preserving the checkpoint opportunity for a fresh-runner retry."
                bounded_rm_rf "${GITHUB_WORKSPACE}/resume/preferred" || true
                fail_prepare_step infrastructure
              else
                echo "::warning::Rejecting deterministically unusable preferred checkpoint bundle: ${preferred_candidate}"
                bounded_rm_rf "${GITHUB_WORKSPACE}/resume/preferred" || true
              fi
            else
              echo "::error::Preferred checkpoint download failed after provenance succeeded; retrying on a fresh runner instead of discarding same-stage progress."
              bounded_rm_rf "${GITHUB_WORKSPACE}/resume/preferred" || true
              fail_prepare_step infrastructure
            fi
          elif [ "${preferred_rc}" -eq 2 ]; then
            echo "Preferred checkpoint is unavailable under artifact retention; trying fallback/fresh output."
          else
            echo "failure_class=${CHECKPOINT_PROVENANCE_FAILURE_CLASS:-deterministic_build}" >> "${GITHUB_OUTPUT}"
            exit 1
          fi
        fi

        if [ -z "${resume_archive}" ] && [ -n "${{ inputs.fallback-checkpoint-artifact }}" ]; then
          echo "Preferred checkpoint unavailable or invalid; validating fallback provenance before download."
          fallback_rc=0
          validate_checkpoint_source_run \
            "${{ inputs.fallback-checkpoint-run-id }}" \
            "${{ inputs.version }}" \
            "${{ inputs.stage }}" \
            "${{ inputs.fallback-checkpoint-artifact }}" || fallback_rc=$?
          if [ "${fallback_rc}" -eq 0 ]; then
            fallback_sha="${CHECKPOINT_PRODUCER_SHA}"
            fallback_stage="${CHECKPOINT_PRODUCER_STAGE}"
            fallback_run_attempt="${CHECKPOINT_PRODUCER_RUN_ATTEMPT}"
            echo "Fallback provenance accepted; downloading checkpoint on demand."
            if ! mkdir -p "${GITHUB_WORKSPACE}/resume/fallback"; then
              fail_prepare_step infrastructure
            fi
            if bounded_gh run download "${{ inputs.fallback-checkpoint-run-id }}" \
              --repo "${GITHUB_REPOSITORY}" \
              --name "${{ inputs.fallback-checkpoint-artifact }}" \
              --dir "${GITHUB_WORKSPACE}/resume/fallback"; then
              fallback_candidate="${GITHUB_WORKSPACE}/resume/fallback/out-Release_x86.tar.zst"
              fallback_bundle_rc=1
              if [ -s "${fallback_candidate}" ]; then
                fallback_bundle_rc=0
                checkpoint_bundle_is_usable \
                  "${fallback_candidate}" "${{ inputs.version }}" "${{ inputs.stage }}" \
                  "${fallback_sha}" "${fallback_stage}" "${{ inputs.fallback-checkpoint-run-id }}" \
                  "${fallback_run_attempt}" || fallback_bundle_rc=$?
              fi
              if [ "${fallback_bundle_rc}" -eq 0 ]; then
                resume_archive="${fallback_candidate}"
                resume_producer_sha="${fallback_sha}"
                resume_producer_stage="${fallback_stage}"
                resume_producer_run_id="${{ inputs.fallback-checkpoint-run-id }}"
                resume_producer_run_attempt="${fallback_run_attempt}"
              elif [ "${CHECKPOINT_BUNDLE_FAILURE_CLASS:-deterministic_build}" = infrastructure ]; then
                echo "::error::Fallback checkpoint validation failed due to runner/tool infrastructure; retrying rather than discarding prior-stage progress."
                bounded_rm_rf "${GITHUB_WORKSPACE}/resume/fallback" || true
                fail_prepare_step infrastructure
              else
                echo "::warning::Rejecting deterministically unusable fallback checkpoint bundle: ${fallback_candidate}"
                bounded_rm_rf "${GITHUB_WORKSPACE}/resume/fallback" || true
              fi
            else
              echo "::error::Fallback checkpoint download failed after provenance succeeded; retrying on a fresh runner instead of rebuilding from scratch."
              bounded_rm_rf "${GITHUB_WORKSPACE}/resume/fallback" || true
              fail_prepare_step infrastructure
            fi
          elif [ "${fallback_rc}" -eq 2 ]; then
            echo "Fallback checkpoint is unavailable under artifact retention; continuing with fresh output/ccache."
          else
            echo "failure_class=${CHECKPOINT_PROVENANCE_FAILURE_CLASS:-deterministic_build}" >> "${GITHUB_OUTPUT}"
            exit 1
          fi
        fi

        if [ -n "${resume_archive}" ]; then
          if ! restore_out_checkpoint \
            "${resume_archive}" "${{ inputs.version }}" "${{ inputs.stage }}" true \
            "${resume_producer_sha}" "${resume_producer_stage}" \
            "${resume_producer_run_id}" "${resume_producer_run_attempt}"; then
            fail_prepare_step "${CHECKPOINT_RESTORE_FAILURE_CLASS:-infrastructure}"
          fi
          checkpoint_restored=true
          echo "Checkpoint restored from ${resume_archive}"
        else
          if ! restore_out_checkpoint "" "${{ inputs.version }}" "${{ inputs.stage }}"; then
            fail_prepare_step "${CHECKPOINT_RESTORE_FAILURE_CLASS:-infrastructure}"
          fi
        fi
        bounded_rm_rf "${GITHUB_WORKSPACE}/resume" || true

        log_runner_storage "stage-${{ inputs.stage }}-${{ inputs.attempt }} after source/checkpoint extraction" || true
        if [ "${checkpoint_restored}" = "true" ] && [ "${CHECKPOINT_REQUIRES_GN_REFRESH}" = "true" ]; then
          echo "Migrating restored checkpoint graph to Chromium's exact source-declared GN pin."
          if ! configure_gn; then
            fail_prepare_step "${CHROMIUM_PREPARE_FAILURE_CLASS:-deterministic_build}"
          fi
        else
          if ! configure_gn_from_checkpoint_or_fresh "${checkpoint_restored}"; then
            fail_prepare_step "${CHROMIUM_PREPARE_FAILURE_CLASS:-deterministic_build}"
          fi
        fi
        if [ "${checkpoint_restored}" = "true" ]; then
          report_ninja_resume_state
        fi
        if ! verify_i386_runtime_dependencies; then
          echo "failure_class=${I386_RUNTIME_REPAIR_FAILURE_CLASS:-runtime_environment}" >> "${GITHUB_OUTPUT}"
          exit 1
        fi

    - name: Resolve prepared Chromium source cache identity
      id: prepared_source_cache_identity
      if: ${{ always() && steps.prepare.outcome == 'success' }}
      shell: bash
      run: |
        set -euo pipefail
        metadata="${GITHUB_WORKSPACE}/.chromium-source-cache/chromium-${{ inputs.version }}.source-object.json"
        test -s "${metadata}" || {
          echo "::warning::Prepared source metadata is unavailable; skipping immutable source cache save."
          echo "cache_key=" >> "${GITHUB_OUTPUT}"
          exit 0
        }
        cache_key="$(python3 scripts/chromium_source_object.py \
          --version "${{ inputs.version }}" \
          --metadata-in "${metadata}" \
          --cache-key-only)"
        echo "cache_key=${cache_key}" >> "${GITHUB_OUTPUT}"
        if [ "${{ steps.source_cache_identity.outputs.resolved }}" = "true" ] \
            && [ "${cache_key}" != "${{ steps.source_cache_identity.outputs.cache_key }}" ]; then
          echo "::warning::Chromium source object generation changed during this job; saving only under the prepared authoritative generation key ${cache_key}."
        fi

    - name: Save Chromium source tarball cache
      if: >-
        ${{
          always() &&
          steps.prepare.outcome == 'success' &&
          steps.prepared_source_cache_identity.outputs.cache_key != '' &&
          (
            steps.source_cache.outputs.cache-hit != 'true' ||
            steps.source_cache_identity.outputs.cache_key != steps.prepared_source_cache_identity.outputs.cache_key
          )
        }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      continue-on-error: true
      with:
        path: ${{ github.workspace }}/.chromium-source-cache
        key: ${{ steps.prepared_source_cache_identity.outputs.cache_key }}

    - name: Log Storage Before Compile
      if: ${{ steps.prepare.outcome == 'success' }}
      shell: bash
      run: |
        source .github/scripts/runner_diagnostics.sh
        log_runner_storage "stage-${{ inputs.stage }}-${{ inputs.attempt }} before compile"

    - name: Compile Until Checkpoint
      id: compile
      if: ${{ steps.prepare.outcome == 'success' }}
      shell: bash
      run: |
        source .github/scripts/chromium_i686_common.sh
        run_build_until_checkpoint "${GITHUB_OUTPUT}"

    - name: Log Storage After Compile
      if: ${{ always() }}
      shell: bash
      run: |
        source .github/scripts/runner_diagnostics.sh
        log_runner_storage "stage-${{ inputs.stage }}-${{ inputs.attempt }} after compile" || true

    - name: Create Stage Checkpoint
      id: checkpoint
      if: ${{ always() && steps.prepare.outcome == 'success' && steps.compile.outputs.complete != 'true' }}
      shell: bash
      run: |
        source .github/scripts/chromium_i686_common.sh
        source .github/scripts/chromium_i686_resume.sh
        if ! create_out_checkpoint "${{ inputs.version }}" "${{ inputs.stage }}"; then
          echo "failure_class=${CHECKPOINT_CREATE_FAILURE_CLASS:-infrastructure}" >> "${GITHUB_OUTPUT}"
          exit 1
        fi

    - name: Upload Stable Stage Checkpoint
      id: checkpoint_artifact
      if: ${{ always() && steps.checkpoint.outcome == 'success' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: chromium-i686-out-stage-${{ inputs.stage }}
        path: |
          ${{ github.workspace }}/checkpoints/out-Release_x86.tar.zst
          ${{ github.workspace }}/checkpoints/out-Release_x86.tar.zst.sha256
          ${{ github.workspace }}/checkpoints/checkpoint-manifest.json
        retention-days: ${{ env.CHECKPOINT_RETENTION_DAYS }}
        compression-level: 0
        overwrite: true
        if-no-files-found: error

    - name: Classify Stage Checkpoint Upload Failure
      id: checkpoint_artifact_failure
      if: ${{ always() && steps.checkpoint.outcome == 'success' && steps.checkpoint_artifact.outcome == 'failure' }}
      shell: bash
      run: echo "failure_class=infrastructure" >> "${GITHUB_OUTPUT}"

    - name: Package Chromium i686 Build
      id: package
      if: ${{ steps.compile.outputs.complete == 'true' }}
      shell: bash
      run: |
        source .github/scripts/chromium_i686_common.sh
        if ! package_chromium_i686 "${{ inputs.version }}"; then
          echo "failure_class=${CHROMIUM_PACKAGE_FAILURE_CLASS:-deterministic_build}" >> "${GITHUB_OUTPUT}"
          exit 1
        fi

    - name: Upload Build Artifact
      id: build_artifact
      if: ${{ success() && steps.compile.outputs.complete == 'true' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: chromium-${{ inputs.version }}-linux-i686
        path: |
          ${{ github.workspace }}/chromium-${{ inputs.version }}-linux-i686.tar.xz
          ${{ github.workspace }}/chromium-${{ inputs.version }}-linux-i686.tar.xz.sha256
          ${{ github.workspace }}/chromium-${{ inputs.version }}-linux-i686-manifest.txt
        if-no-files-found: error

    - name: Preserve completed output after packaging or artifact failure
      id: final_recovery
      if: >-
        ${{
          failure() &&
          steps.prepare.outcome == 'success' &&
          steps.compile.outputs.complete == 'true' &&
          (steps.package.outcome == 'failure' || steps.build_artifact.outcome == 'failure')
        }}
      shell: bash
      run: |
        source .github/scripts/chromium_i686_common.sh
        source .github/scripts/chromium_i686_resume.sh
        if ! create_out_checkpoint "${{ inputs.version }}" "${{ inputs.stage }}"; then
          echo "failure_class=${CHECKPOINT_CREATE_FAILURE_CLASS:-infrastructure}" >> "${GITHUB_OUTPUT}"
          exit 1
        fi
        if [ "${{ steps.build_artifact.outcome }}" = "failure" ]; then
          echo "failure_class=infrastructure" >> "${GITHUB_OUTPUT}"
        fi

    - name: Upload Final Output Recovery Checkpoint
      id: final_recovery_artifact
      if: ${{ always() && steps.final_recovery.outcome == 'success' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: chromium-i686-out-stage-${{ inputs.stage }}
        path: |
          ${{ github.workspace }}/checkpoints/out-Release_x86.tar.zst
          ${{ github.workspace }}/checkpoints/out-Release_x86.tar.zst.sha256
          ${{ github.workspace }}/checkpoints/checkpoint-manifest.json
        retention-days: ${{ env.CHECKPOINT_RETENTION_DAYS }}
        compression-level: 0
        overwrite: true
        if-no-files-found: error

    - name: Classify Final Recovery Upload Failure
      id: recovery_artifact_failure
      if: ${{ always() && steps.final_recovery.outcome == 'success' && steps.final_recovery_artifact.outcome == 'failure' }}
      shell: bash
      run: echo "failure_class=infrastructure" >> "${GITHUB_OUTPUT}"

    - name: Write Stage Summary
      if: ${{ always() }}
      shell: bash
      run: |
        source .github/scripts/chromium_i686_common.sh
        write_stage_summary \
          "${{ inputs.version }}" \
          "${{ inputs.stage }}" \
          "${{ inputs.attempt }}" \
          "${{ steps.compile.outputs.complete || 'false' }}" \
          "${{ steps.recovery_artifact_failure.outputs.failure_class || steps.checkpoint_artifact_failure.outputs.failure_class || steps.compile.outputs.failure_class || steps.prepare.outputs.failure_class || steps.runtime.outputs.failure_class || steps.system_dependencies.outputs.failure_class || steps.runner_setup.outputs.failure_class || steps.job_start.outputs.failure_class || steps.package.outputs.failure_class || steps.final_recovery.outputs.failure_class || steps.checkpoint.outputs.failure_class || 'none' }}"

    - name: Fail When Final Stage Is Still Incomplete
      if: ${{ always() && inputs.final-stage == 'true' && steps.prepare.outcome == 'success' && steps.compile.outputs.complete != 'true' }}
      shell: bash
      run: |
        echo "::error::Chromium is still incomplete after the final configured compiler stage. The latest checkpoint was preserved."
        exit 1
