name: Watch Chromium Windows Stable for i686

on:
  schedule:
    - cron: "47 */6 * * *"
  workflow_dispatch:
    inputs:
      force_version:
        description: Optional exact newer Chromium Windows stable version.
        required: false
        default: ""
        type: string
      dry_run:
        description: Report what would be dispatched without starting a build.
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.ref_name == github.event.repository.default_branch && 'chromium-windows-i686-stable-watcher' || format('chromium-windows-i686-stable-watcher-nonprod-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  detect:
    if: ${{ github.ref_name == github.event.repository.default_branch }}
    permissions:
      contents: read
      actions: write
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout immutable Windows port metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Detect unprocessed Windows stable releases
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_VERSION: ${{ inputs.force_version }}
          MANUAL_DRY_RUN: ${{ inputs.dry_run }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --lane windows
            --repository "${GITHUB_REPOSITORY}"
            --ref "${DEFAULT_BRANCH}"
            --expected-head-sha "${WORKFLOW_SHA}"
            --baseline support/baseline.json
            --max-new-builds 1
          )
          if [ -n "${FORCE_VERSION}" ]; then args+=(--force-version "${FORCE_VERSION}"); fi
          if [ "${GITHUB_EVENT_NAME}" = workflow_dispatch ] && [ "${MANUAL_DRY_RUN}" = true ]; then args+=(--dry-run); fi
          python3 scripts/chromium_stable_watcher.py "${args[@]}"
      - name: Clear recovered Windows watcher issue
        if: ${{ success() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/github_maintenance_issue.py \
            --repository "${GITHUB_REPOSITORY}" \
            --title "[windows-i686-port] Stable watcher requires maintenance" \
            --close-if-open \
            || echo "::warning::Windows watcher succeeded but issue cleanup failed; a later run will retry."

  report_watcher_failure:
    name: Report Windows stable watcher failure
    needs: detect
    if: ${{ always() && needs.detect.result == 'failure' && github.ref_name == github.event.repository.default_branch }}
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted maintenance helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Open or update Windows watcher issue
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          title="[windows-i686-port] Stable watcher requires maintenance"
          body_file="${RUNNER_TEMP}/windows-stable-watcher-failure.md"
          cat > "${body_file}" <<EOF
          The Chromium Windows i686 stable watcher failed closed and dispatched no work.

          - Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Workflow commit: ${GITHUB_SHA}

          This can indicate GitHub/API/schema drift or a bounded history horizon requiring deliberate expansion. The next successful run closes this issue.
          EOF
          python3 scripts/github_maintenance_issue.py --repository "${GITHUB_REPOSITORY}" --title "${title}" --body-file "${body_file}"
