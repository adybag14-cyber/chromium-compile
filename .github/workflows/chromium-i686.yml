name: Chromium i686 Build (Unofficial Port)
run-name: Chromium i686 ${{ inputs.version }} - stage ${{ inputs.stage || '1' }} - attempt ${{ inputs.retry_count || '0' }}

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "Compiler stage to run"
        required: false
        default: "1"
        type: string
      version:
        description: "Exact pinned Chromium version"
        required: true
        type: string
      preferred_checkpoint_run_id:
        description: "Run containing a same-stage partial checkpoint"
        required: false
        default: ""
        type: string
      fallback_checkpoint_run_id:
        description: "Run containing the previous completed stage checkpoint"
        required: false
        default: ""
        type: string
      retry_count:
        description: "Automatic runner-recovery attempt counter"
        required: false
        default: "0"
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: chromium-i686-port-queue
  cancel-in-progress: false

env:
  JOB_CHECKPOINT_MINUTES: ${{ vars.CHROMIUM_I686_CHECKPOINT_MINUTES || '340' }}
  CHECKPOINT_RETENTION_DAYS: "14"
  CCACHE_MAX_SIZE: 8G
  MAX_RUNNER_RETRIES: ${{ vars.CHROMIUM_RUNNER_RETRIES || '2' }}
  MAX_COMPILER_STAGES: ${{ vars.CHROMIUM_I686_MAX_STAGES || '20' }}
  ALLOW_LEGACY_CHECKPOINT_VERSION: ${{ vars.CHROMIUM_ALLOW_LEGACY_CHECKPOINT_VERSION || '' }}

jobs:
  build:
    name: Build Stage ${{ inputs.stage || '1' }}
    runs-on: ${{ vars.CHROMIUM_I686_RUNNER || 'ubuntu-22.04' }}
    timeout-minutes: 360
    outputs:
      stage: ${{ steps.control.outputs.stage }}
      max_stage: ${{ steps.control.outputs.max_stage }}
      version: ${{ steps.control.outputs.version }}
      retry_count: ${{ steps.control.outputs.retry_count }}
      max_retries: ${{ steps.control.outputs.max_retries }}
      complete: ${{ steps.compiler.outputs.complete }}
      failure_class: ${{ steps.compiler.outputs.failure_class }}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - name: Checkout workflow helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve stage controls
        id: control
        env:
          REQUESTED_STAGE: ${{ inputs.stage }}
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_RETRY_COUNT: ${{ inputs.retry_count }}
        shell: bash
        run: |
          set -euo pipefail
          stage="${REQUESTED_STAGE:-1}"
          retry_count="${REQUESTED_RETRY_COUNT:-0}"
          version="${REQUESTED_VERSION:-}"
          max_stage="${MAX_COMPILER_STAGES}"

          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::version must use the form 150.0.7871.186"
            exit 1
          }
          [[ "${stage}" =~ ^[0-9]+$ ]] || {
            echo "::error::stage must be an integer"
            exit 1
          }
          [[ "${max_stage}" =~ ^[0-9]+$ ]] || {
            echo "::error::CHROMIUM_I686_MAX_STAGES must be an integer"
            exit 1
          }
          if [ "${stage}" -lt 1 ] || [ "${stage}" -gt "${max_stage}" ]; then
            echo "::error::stage must be between 1 and ${max_stage}"
            exit 1
          fi
          [[ "${MAX_RUNNER_RETRIES}" =~ ^[0-9]+$ ]] || {
            echo "::error::CHROMIUM_RUNNER_RETRIES must be an integer"
            exit 1
          }
          [[ "${retry_count}" =~ ^[0-9]+$ ]] || {
            echo "::error::retry_count must be an integer"
            exit 1
          }
          if [ "${retry_count}" -lt 0 ] || [ "${retry_count}" -gt "${MAX_RUNNER_RETRIES}" ]; then
            echo "::error::retry_count must be between 0 and ${MAX_RUNNER_RETRIES}"
            exit 1
          fi

          echo "stage=${stage}" >> "${GITHUB_OUTPUT}"
          echo "max_stage=${max_stage}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "retry_count=${retry_count}" >> "${GITHUB_OUTPUT}"
          echo "max_retries=${MAX_RUNNER_RETRIES}" >> "${GITHUB_OUTPUT}"
          echo "Stage: ${stage}/${max_stage}; Chromium: ${version}; runner attempt: ${retry_count}"

      - name: Resolve checkpoint sources
        id: checkpoint
        env:
          STAGE: ${{ steps.control.outputs.stage }}
          PREFERRED_RUN_ID: ${{ inputs.preferred_checkpoint_run_id }}
          FALLBACK_RUN_ID: ${{ inputs.fallback_checkpoint_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          preferred_artifact=""
          fallback_artifact=""

          if [ -n "${PREFERRED_RUN_ID:-}" ]; then
            preferred_artifact="chromium-i686-out-stage-${STAGE}"
          fi
          if [ "${STAGE}" -gt 1 ] && [ -n "${FALLBACK_RUN_ID:-}" ]; then
            fallback_artifact="chromium-i686-out-stage-$((STAGE - 1))"
          fi

          echo "preferred_artifact=${preferred_artifact}" >> "${GITHUB_OUTPUT}"
          echo "fallback_artifact=${fallback_artifact}" >> "${GITHUB_OUTPUT}"
          echo "Preferred checkpoint: ${preferred_artifact:-none} from ${PREFERRED_RUN_ID:-none}"
          echo "Fallback checkpoint: ${fallback_artifact:-none} from ${FALLBACK_RUN_ID:-none}"

      - name: Run resumable compiler stage
        id: compiler
        uses: ./.github/actions/chromium-i686-stage
        with:
          stage: ${{ steps.control.outputs.stage }}
          attempt: ${{ steps.control.outputs.retry_count == '0' && 'primary' || format('recovery-{0}', steps.control.outputs.retry_count) }}
          version: ${{ steps.control.outputs.version }}
          preferred-checkpoint-artifact: ${{ steps.checkpoint.outputs.preferred_artifact }}
          preferred-checkpoint-run-id: ${{ inputs.preferred_checkpoint_run_id }}
          fallback-checkpoint-artifact: ${{ steps.checkpoint.outputs.fallback_artifact }}
          fallback-checkpoint-run-id: ${{ inputs.fallback_checkpoint_run_id }}
          final-stage: ${{ steps.control.outputs.stage == steps.control.outputs.max_stage && 'true' || 'false' }}

  continue_pipeline:
    permissions:
      actions: write
      contents: read
    name: Dispatch next compiler stage
    needs: build
    if: >-
      ${{
        needs.build.result == 'success' &&
        needs.build.outputs.complete != 'true' &&
        github.ref_name == github.event.repository.default_branch &&
        fromJSON(needs.build.outputs.stage) < fromJSON(needs.build.outputs.max_stage)
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout dispatch helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Start next stage on a fresh runner exactly once
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_STAGE: ${{ needs.build.outputs.stage }}
          CHROMIUM_VERSION: ${{ needs.build.outputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          next_stage=$((CURRENT_STAGE + 1))
          expected_title="Chromium i686 ${CHROMIUM_VERSION} - stage ${next_stage} - attempt 0"
          echo "Dispatching stage ${next_stage} with checkpoint from run ${GITHUB_RUN_ID}."
          python3 scripts/github_workflow_dispatch.py \
            --repository "${GITHUB_REPOSITORY}" \
            --workflow chromium-i686.yml \
            --ref "${DEFAULT_BRANCH}" \
            --expected-title "${expected_title}" \
            --dedupe-completed \
            --dedupe-since-run-id "${GITHUB_RUN_ID}" \
            --input "stage=${next_stage}" \
            --input "version=${CHROMIUM_VERSION}" \
            --input "preferred_checkpoint_run_id=" \
            --input "fallback_checkpoint_run_id=${GITHUB_RUN_ID}" \
            --input "retry_count=0"

  recover_bad_runner:
    permissions:
      actions: write
      contents: read
    name: Recover stage on a fresh runner
    needs: build
    if: >-
      ${{
        always() &&
        (needs.build.result == 'failure' || needs.build.result == 'cancelled') &&
        github.ref_name == github.event.repository.default_branch &&
        needs.build.outputs.failure_class != 'deterministic_build' &&
        fromJSON(needs.build.outputs.retry_count || inputs.retry_count || '0') < fromJSON(needs.build.outputs.max_retries || '0')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout dispatch helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Redispatch failed stage exactly once
        env:
          GH_TOKEN: ${{ github.token }}
          STAGE: ${{ needs.build.outputs.stage || inputs.stage || '1' }}
          CHROMIUM_VERSION: ${{ needs.build.outputs.version || inputs.version }}
          RETRY_COUNT: ${{ needs.build.outputs.retry_count || inputs.retry_count || '0' }}
          FALLBACK_RUN_ID: ${{ inputs.fallback_checkpoint_run_id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          next_retry=$((RETRY_COUNT + 1))
          expected_title="Chromium i686 ${CHROMIUM_VERSION} - stage ${STAGE} - attempt ${next_retry}"
          echo "Runner/environment failure during stage ${STAGE}; dispatching recovery attempt ${next_retry}."
          echo "The recovery run will first try a same-stage checkpoint from run ${GITHUB_RUN_ID}, then fall back to ${FALLBACK_RUN_ID:-a fresh stage}."
          python3 scripts/github_workflow_dispatch.py \
            --repository "${GITHUB_REPOSITORY}" \
            --workflow chromium-i686.yml \
            --ref "${DEFAULT_BRANCH}" \
            --expected-title "${expected_title}" \
            --dedupe-completed \
            --dedupe-since-run-id "${GITHUB_RUN_ID}" \
            --input "stage=${STAGE}" \
            --input "version=${CHROMIUM_VERSION}" \
            --input "preferred_checkpoint_run_id=${GITHUB_RUN_ID}" \
            --input "fallback_checkpoint_run_id=${FALLBACK_RUN_ID}" \
            --input "retry_count=${next_retry}"

  report_terminal_failure:
    name: Record terminal port failure
    needs:
      - build
      - recover_bad_runner
    if: >-
      ${{
        always() &&
        (needs.build.result == 'failure' || needs.build.result == 'cancelled') &&
        github.ref_name == github.event.repository.default_branch &&
        needs.recover_bad_runner.result != 'success'
      }}
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout maintenance helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Open or update terminal maintenance issue
        env:
          GH_TOKEN: ${{ github.token }}
          CHROMIUM_VERSION: ${{ needs.build.outputs.version || inputs.version }}
          STAGE: ${{ needs.build.outputs.stage || inputs.stage || '1' }}
          RETRY_COUNT: ${{ needs.build.outputs.retry_count || inputs.retry_count || '0' }}
          FAILURE_CLASS: ${{ needs.build.outputs.failure_class || 'unknown' }}
        shell: bash
        run: |
          set -euo pipefail
          title="[i686-port] Chromium ${CHROMIUM_VERSION} requires maintenance"
          body_file="${RUNNER_TEMP}/chromium-i686-terminal-failure.md"
          cat > "${body_file}" <<EOF
          Chromium ${CHROMIUM_VERSION} reached a terminal Linux i686 pipeline failure.

          - Stage: ${STAGE}
          - Runner attempt: ${RETRY_COUNT}
          - Failure class: ${FAILURE_CLASS}
          - Build result: ${{ needs.build.result }}
          - Recovery job result: ${{ needs.recover_bad_runner.result }}
          - Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Workflow commit: ${GITHUB_SHA}

          The stable watcher also treats recent terminal workflow history as backup quarantine state. Use a forced/manual retry only after the underlying compatibility or infrastructure issue is addressed.
          EOF
          python3 scripts/github_maintenance_issue.py \
            --repository "${GITHUB_REPOSITORY}" \
            --title "${title}" \
            --body-file "${body_file}"
