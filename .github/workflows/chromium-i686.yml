      - name: Restore ccache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: ${{ env.CCACHE_DIR }}
          key: chromium-i686-ccache-${{ env.VERSION }}-${{ github.run_id }}-${{ github.run_attempt }}-stage-2
          restore-keys: |
            chromium-i686-ccache-${{ env.VERSION }}-${{ github.run_id }}-${{ github.run_attempt }}-stage-1
            chromium-i686-ccache-${{ env.VERSION }}-

      - name: Download Stage 1 Checkpoint
        uses: actions/download-artifact@v4
        with:
          name: chromium-i686-out-stage-1
          path: ${{ github.workspace }}/resume
          run-id: ${{ inputs.resume_run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore Chromium source tarball cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: ${{ github.workspace }}/.chromium-source-cache
          key: chromium-src-${{ env.VERSION }}-${{ github.run_id }}
          restore-keys: |
            chromium-src-${{ env.VERSION }}-

      - name: Prepare Chromium Source
        run: |
          source .github/scripts/chromium_i686_common.sh
          prepare_chromium_source "${VERSION}"
          install_chromium_clang
          install_i386_sysroot
          patch_build_gn_for_x86_linux
          write_lastchange
          configure_ccache
          restore_out_checkpoint "${GITHUB_WORKSPACE}/resume/out-Release_x86.tar.zst"
          configure_gn

      - name: Save Chromium source tarball cache
        if: always()
