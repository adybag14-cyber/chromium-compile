name: Chromium i686 Build (Unofficial Port)
run-name: Chromium i686 ${{ inputs.version }} - stage ${{ inputs.stage || '1' }} - attempt ${{ inputs.retry_count || '0' }}

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "Compiler stage to run"
        required: false
        default: "1"
        type: string
      version:
        description: "Exact pinned Chromium version"
        required: true
        type: string
      preferred_checkpoint_run_id:
        description: "Run containing a same-stage partial checkpoint"
        required: false
        default: ""
        type: string
      fallback_checkpoint_run_id:
        description: "Run containing the previous completed stage checkpoint"
        required: false
        default: ""
        type: string
      validation_checkpoint_ref:
        description: "Validation-only source branch for trusted checkpoints; non-default runs may name only the default branch"
        required: false
        default: ""
        type: string
      older_checkpoint_run_id:
        description: "Run containing the older retained checkpoint generation; automatic lineage only"
        required: false
        default: ""
        type: string
      retry_count:
        description: "Automatic runner-recovery attempt counter"
        required: false
        default: "0"
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.ref_name == github.event.repository.default_branch && 'chromium-i686-port-queue' || format('chromium-i686-build-nonprod-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  JOB_CHECKPOINT_MINUTES: ${{ vars.CHROMIUM_I686_CHECKPOINT_MINUTES || '340' }}
  CHROMIUM_I686_NINJA_STALL_MINUTES: ${{ vars.CHROMIUM_I686_NINJA_STALL_MINUTES || '90' }}
  CHECKPOINT_RETENTION_DAYS: "14"
  CCACHE_MAX_SIZE: 8G
  MAX_RUNNER_RETRIES: ${{ vars.CHROMIUM_RUNNER_RETRIES || '2' }}
  MAX_COMPILER_STAGES: ${{ vars.CHROMIUM_I686_MAX_STAGES || '20' }}
  ALLOW_LEGACY_CHECKPOINT_VERSION: ${{ vars.CHROMIUM_ALLOW_LEGACY_CHECKPOINT_VERSION || '' }}

jobs:
  resolve_runner:
    name: Resolve tested i686 runner
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      label: ${{ steps.resolve.outputs.label }}
      valid: ${{ steps.resolve.outputs.valid }}
    steps:
      - name: Validate configured hosted runner label
        id: resolve
        env:
          REQUESTED_RUNNER: ${{ vars.CHROMIUM_I686_RUNNER || 'ubuntu-24.04' }}
        shell: bash
        run: |
          set -euo pipefail
          case "${REQUESTED_RUNNER}" in
            ubuntu-22.04|ubuntu-24.04)
              echo "label=${REQUESTED_RUNNER}" >> "${GITHUB_OUTPUT}"
              echo "valid=true" >> "${GITHUB_OUTPUT}"
              echo "Validated Chromium i686 runner label: ${REQUESTED_RUNNER}"
              ;;
            *)
              echo "label=" >> "${GITHUB_OUTPUT}"
              echo "valid=false" >> "${GITHUB_OUTPUT}"
              echo "::error::Unsupported CHROMIUM_I686_RUNNER '${REQUESTED_RUNNER}'. Allowed explicit production labels: ubuntu-22.04, ubuntu-24.04."
              ;;
          esac

  report_runner_configuration:
    name: Report invalid i686 runner configuration
    needs: resolve_runner
    if: ${{ always() && github.ref_name == github.event.repository.default_branch && (needs.resolve_runner.result != 'success' || needs.resolve_runner.outputs.valid != 'true') }}
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted maintenance helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Record runner configuration failure
        env:
          GH_TOKEN: ${{ github.token }}
          CHROMIUM_VERSION: ${{ inputs.version }}
          REQUESTED_RUNNER: ${{ vars.CHROMIUM_I686_RUNNER || 'ubuntu-24.04' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${CHROMIUM_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            title="[i686-port] Chromium ${CHROMIUM_VERSION} requires maintenance"
          else
            title="[i686-port] Chromium pipeline requires maintenance"
          fi
          body_file="${RUNNER_TEMP}/chromium-i686-runner-configuration.md"
          cat > "${body_file}" <<EOF
          Chromium i686 runner selection could not be validated before scheduling the heavyweight compatibility job.

          - Requested runner: ${REQUESTED_RUNNER}
          - Allowed explicit production labels: ubuntu-22.04, ubuntu-24.04
          - Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          Update CHROMIUM_I686_RUNNER only together with a green LTS compatibility-matrix change.
          EOF
          python3 scripts/github_maintenance_issue.py --repository "${GITHUB_REPOSITORY}" --title "${title}" --body-file "${body_file}" || true
          exit 1

  build:
    name: Build Stage ${{ inputs.stage || '1' }}
    needs: resolve_runner
    if: ${{ needs.resolve_runner.outputs.valid == 'true' }}
    runs-on: ${{ needs.resolve_runner.outputs.label }}
    timeout-minutes: 360
    outputs:
      stage: ${{ steps.control.outputs.stage }}
      max_stage: ${{ steps.control.outputs.max_stage }}
      version: ${{ steps.control.outputs.version }}
      retry_count: ${{ steps.control.outputs.retry_count }}
      max_retries: ${{ steps.control.outputs.max_retries }}
      complete: ${{ steps.compiler.outputs.complete }}
      failure_class: ${{ steps.compiler.outputs.failure_class || steps.control.outputs.failure_class }}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CHECKPOINT_EXPECTED_REF: ${{ inputs.validation_checkpoint_ref || github.ref_name }}
    steps:
      - name: Checkout workflow helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve stage controls
        id: control
        env:
          REQUESTED_STAGE: ${{ inputs.stage }}
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_RETRY_COUNT: ${{ inputs.retry_count }}
          REQUESTED_CHECKPOINT_REF: ${{ inputs.validation_checkpoint_ref }}
          PREFERRED_RUN_ID: ${{ inputs.preferred_checkpoint_run_id }}
          CURRENT_REF: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          stage="${REQUESTED_STAGE:-1}"
          retry_count="${REQUESTED_RETRY_COUNT:-0}"
          version="${REQUESTED_VERSION:-}"
          max_stage="${MAX_COMPILER_STAGES}"
          checkpoint_minutes="${JOB_CHECKPOINT_MINUTES}"
          ninja_stall_minutes="${CHROMIUM_I686_NINJA_STALL_MINUTES}"

          control_fail() {
            echo "failure_class=deterministic_build" >> "${GITHUB_OUTPUT}"
            echo "::error::$1"
            exit 1
          }

          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || control_fail "version must use the form 150.0.7871.186"
          [[ "${stage}" =~ ^[1-9][0-9]?$ ]] \
            || control_fail "stage must be an integer from 1 through 50"
          [[ "${max_stage}" =~ ^[0-9]{1,2}$ ]] \
            || control_fail "CHROMIUM_I686_MAX_STAGES must be an integer from 1 through 50"
          if [ "${max_stage}" -lt 1 ] || [ "${max_stage}" -gt 50 ]; then
            control_fail "CHROMIUM_I686_MAX_STAGES must be between 1 and 50"
          fi
          if [ "${stage}" -lt 1 ] || [ "${stage}" -gt "${max_stage}" ]; then
            control_fail "stage must be between 1 and ${max_stage}"
          fi
          [[ "${MAX_RUNNER_RETRIES}" =~ ^[0-9]{1,2}$ ]] \
            || control_fail "CHROMIUM_RUNNER_RETRIES must be an integer from 0 through 10"
          if [ "${MAX_RUNNER_RETRIES}" -gt 10 ]; then
            control_fail "CHROMIUM_RUNNER_RETRIES must not exceed 10 automatic fresh-runner attempts"
          fi
          [[ "${retry_count}" =~ ^(0|[1-9][0-9]?)$ ]] \
            || control_fail "retry_count must be an integer from 0 through 10"
          if [ "${retry_count}" -gt "${MAX_RUNNER_RETRIES}" ]; then
            control_fail "retry_count must be between 0 and ${MAX_RUNNER_RETRIES}"
          fi
          if [ -n "${REQUESTED_CHECKPOINT_REF:-}" ]; then
            if [ "${CURRENT_REF}" = "${DEFAULT_BRANCH}" ]; then
              control_fail "validation_checkpoint_ref is forbidden on the default branch"
            fi
            if [ "${REQUESTED_CHECKPOINT_REF}" != "${DEFAULT_BRANCH}" ]; then
              control_fail "validation_checkpoint_ref may name only the repository default branch"
            fi
            if [ -z "${PREFERRED_RUN_ID:-}" ]; then
              control_fail "validation_checkpoint_ref requires preferred_checkpoint_run_id"
            fi
            echo "Validation-only checkpoint provenance override: ${CURRENT_REF} may read trusted checkpoints from ${REQUESTED_CHECKPOINT_REF}; production mutations remain default-branch gated."
          fi
          [[ "${checkpoint_minutes}" =~ ^[1-9][0-9]{0,2}$ ]] \
            || control_fail "CHROMIUM_I686_CHECKPOINT_MINUTES must be an integer from 1 through 340"
          if [ "${checkpoint_minutes}" -gt 340 ]; then
            control_fail "CHROMIUM_I686_CHECKPOINT_MINUTES must not exceed 340 so a 20-minute checkpoint/artifact reserve remains inside the 360-minute job timeout"
          fi
          [[ "${ninja_stall_minutes}" =~ ^[1-9][0-9]{1,2}$ ]] \
            || control_fail "CHROMIUM_I686_NINJA_STALL_MINUTES must be an integer from 30 through 180"
          if [ "${ninja_stall_minutes}" -lt 30 ] || [ "${ninja_stall_minutes}" -gt 180 ]; then
            control_fail "CHROMIUM_I686_NINJA_STALL_MINUTES must be between 30 and 180 minutes"
          fi

          echo "stage=${stage}" >> "${GITHUB_OUTPUT}"
          echo "max_stage=${max_stage}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "retry_count=${retry_count}" >> "${GITHUB_OUTPUT}"
          echo "max_retries=${MAX_RUNNER_RETRIES}" >> "${GITHUB_OUTPUT}"
          echo "failure_class=" >> "${GITHUB_OUTPUT}"
          echo "Stage: ${stage}/${max_stage}; Chromium: ${version}; runner attempt: ${retry_count}; checkpoint cutoff: ${checkpoint_minutes} minutes; Ninja stall watchdog: ${ninja_stall_minutes} minutes"

      - name: Resolve checkpoint sources
        id: checkpoint
        env:
          STAGE: ${{ steps.control.outputs.stage }}
          PREFERRED_RUN_ID: ${{ inputs.preferred_checkpoint_run_id }}
          FALLBACK_RUN_ID: ${{ inputs.fallback_checkpoint_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          preferred_artifact=""
          fallback_artifact=""

          if [ -n "${PREFERRED_RUN_ID:-}" ]; then
            preferred_artifact="chromium-i686-out-stage-${STAGE}"
          fi
          if [ "${STAGE}" -gt 1 ] && [ -n "${FALLBACK_RUN_ID:-}" ]; then
            fallback_artifact="chromium-i686-out-stage-$((STAGE - 1))"
          fi

          echo "preferred_artifact=${preferred_artifact}" >> "${GITHUB_OUTPUT}"
          echo "fallback_artifact=${fallback_artifact}" >> "${GITHUB_OUTPUT}"
          echo "Preferred checkpoint: ${preferred_artifact:-none} from ${PREFERRED_RUN_ID:-none}"
          echo "Fallback checkpoint: ${fallback_artifact:-none} from ${FALLBACK_RUN_ID:-none}"

      - name: Run resumable compiler stage
        id: compiler
        uses: ./.github/actions/chromium-i686-stage
        with:
          stage: ${{ steps.control.outputs.stage }}
          attempt: ${{ steps.control.outputs.retry_count == '0' && 'primary' || format('recovery-{0}', steps.control.outputs.retry_count) }}
          version: ${{ steps.control.outputs.version }}
          preferred-checkpoint-artifact: ${{ steps.checkpoint.outputs.preferred_artifact }}
          preferred-checkpoint-run-id: ${{ inputs.preferred_checkpoint_run_id }}
          fallback-checkpoint-artifact: ${{ steps.checkpoint.outputs.fallback_artifact }}
          fallback-checkpoint-run-id: ${{ inputs.fallback_checkpoint_run_id }}
          final-stage: ${{ steps.control.outputs.stage == steps.control.outputs.max_stage && 'true' || 'false' }}

  continue_pipeline:
    permissions:
      actions: write
      contents: read
    name: Dispatch next compiler stage
    needs: build
    if: >-
      ${{
        needs.build.result == 'success' &&
        needs.build.outputs.complete != 'true' &&
        github.ref_name == github.event.repository.default_branch &&
        fromJSON(needs.build.outputs.stage) < fromJSON(needs.build.outputs.max_stage)
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout dispatch helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Start next stage on a fresh runner exactly once
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_STAGE: ${{ needs.build.outputs.stage }}
          CHROMIUM_VERSION: ${{ needs.build.outputs.version }}
          FALLBACK_RUN_ID: ${{ inputs.fallback_checkpoint_run_id }}
          OLDER_RUN_ID: ${{ inputs.older_checkpoint_run_id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          next_stage=$((CURRENT_STAGE + 1))
          expected_title="Chromium i686 ${CHROMIUM_VERSION} - stage ${next_stage} - attempt 0"
          echo "Dispatching stage ${next_stage} with checkpoint from run ${GITHUB_RUN_ID}."
          python3 scripts/github_workflow_dispatch.py \
            --repository "${GITHUB_REPOSITORY}" \
            --workflow chromium-i686.yml \
            --ref "${DEFAULT_BRANCH}" \
            --expected-title "${expected_title}" \
            --dedupe-completed \
            --dedupe-since-run-id "${GITHUB_RUN_ID}" \
            --input "stage=${next_stage}" \
            --input "version=${CHROMIUM_VERSION}" \
            --input "preferred_checkpoint_run_id=" \
            --input "fallback_checkpoint_run_id=${GITHUB_RUN_ID}" \
            --input "older_checkpoint_run_id=${FALLBACK_RUN_ID}" \
            --input "retry_count=0"

      - name: Prune superseded checkpoint generations
        if: ${{ github.actor == 'github-actions[bot]' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_STAGE: ${{ needs.build.outputs.stage }}
          CHROMIUM_VERSION: ${{ needs.build.outputs.version }}
          SUPERSEDED_OLDER_RUN_ID: ${{ inputs.older_checkpoint_run_id }}
          SUPERSEDED_PREFERRED_RUN_ID: ${{ inputs.preferred_checkpoint_run_id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          failures=0
          prune_run() {
            local run_id="$1" expected_stage="$2" label="$3"
            [ -n "${run_id}" ] || return 0
            if ! python3 scripts/github_checkpoint_prune.py \
                --repository "${GITHUB_REPOSITORY}" \
                --run-id "${run_id}" \
                --version "${CHROMIUM_VERSION}" \
                --expected-stage "${expected_stage}" \
                --default-branch "${DEFAULT_BRANCH}" \
                --protect-run-id "${GITHUB_RUN_ID}"; then
              echo "::warning::Could not prune superseded ${label} checkpoint from run ${run_id}; retention cleanup is best-effort."
              failures=1
            fi
          }
          if [ "${CURRENT_STAGE}" -gt 2 ]; then
            prune_run "${SUPERSEDED_OLDER_RUN_ID}" "$((CURRENT_STAGE - 2))" older
          fi
          prune_run "${SUPERSEDED_PREFERRED_RUN_ID}" "${CURRENT_STAGE}" preferred
          exit "${failures}"

  recover_bad_runner:
    permissions:
      actions: write
      contents: read
    name: Recover stage on a fresh runner
    needs: build
    if: >-
      ${{
        always() &&
        (needs.build.result == 'failure' || needs.build.result == 'cancelled') &&
        github.ref_name == github.event.repository.default_branch &&
        needs.build.outputs.failure_class != 'deterministic_build'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout dispatch helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Redispatch failed stage exactly once
        env:
          GH_TOKEN: ${{ github.token }}
          STAGE: ${{ needs.build.outputs.stage || inputs.stage || '1' }}
          CHROMIUM_VERSION: ${{ needs.build.outputs.version || inputs.version }}
          RETRY_COUNT: ${{ needs.build.outputs.retry_count || inputs.retry_count || '0' }}
          MAX_RETRIES: ${{ needs.build.outputs.max_retries || vars.CHROMIUM_RUNNER_RETRIES || '2' }}
          FALLBACK_RUN_ID: ${{ inputs.fallback_checkpoint_run_id }}
          OLDER_RUN_ID: ${{ inputs.older_checkpoint_run_id }}
          PARENT_ACTOR: ${{ github.actor }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          next_retry="$(python3 scripts/chromium_runner_recovery.py \
            --version "${CHROMIUM_VERSION}" \
            --stage "${STAGE}" \
            --retry-count "${RETRY_COUNT}" \
            --max-retries "${MAX_RETRIES}")"
          trusted_older_run_id=""
          if [ "${PARENT_ACTOR}" = "github-actions[bot]" ]; then
            trusted_older_run_id="${OLDER_RUN_ID}"
          fi
          expected_title="Chromium i686 ${CHROMIUM_VERSION} - stage ${STAGE} - attempt ${next_retry}"
          echo "Runner/environment failure during stage ${STAGE}; dispatching recovery attempt ${next_retry}."
          echo "The recovery run will first try a same-stage checkpoint from run ${GITHUB_RUN_ID}, then fall back to ${FALLBACK_RUN_ID:-a fresh stage}."
          python3 scripts/github_workflow_dispatch.py \
            --repository "${GITHUB_REPOSITORY}" \
            --workflow chromium-i686.yml \
            --ref "${DEFAULT_BRANCH}" \
            --expected-title "${expected_title}" \
            --dedupe-completed \
            --dedupe-since-run-id "${GITHUB_RUN_ID}" \
            --input "stage=${STAGE}" \
            --input "version=${CHROMIUM_VERSION}" \
            --input "preferred_checkpoint_run_id=${GITHUB_RUN_ID}" \
            --input "fallback_checkpoint_run_id=${FALLBACK_RUN_ID}" \
            --input "older_checkpoint_run_id=${trusted_older_run_id}" \
            --input "retry_count=${next_retry}"

      - name: Prune superseded same-stage recovery checkpoint
        if: ${{ github.actor == 'github-actions[bot]' && inputs.preferred_checkpoint_run_id != '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          STAGE: ${{ needs.build.outputs.stage || inputs.stage || '1' }}
          CHROMIUM_VERSION: ${{ needs.build.outputs.version || inputs.version }}
          SUPERSEDED_PREFERRED_RUN_ID: ${{ inputs.preferred_checkpoint_run_id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/github_checkpoint_prune.py \
            --repository "${GITHUB_REPOSITORY}" \
            --run-id "${SUPERSEDED_PREFERRED_RUN_ID}" \
            --version "${CHROMIUM_VERSION}" \
            --expected-stage "${STAGE}" \
            --default-branch "${DEFAULT_BRANCH}" \
            --protect-run-id "${GITHUB_RUN_ID}"

  prune_completed_checkpoint_history:
    name: Prune superseded completed-build checkpoints
    continue-on-error: true
    needs: build
    if: >-
      ${{
        needs.build.result == 'success' &&
        needs.build.outputs.complete == 'true' &&
        github.ref_name == github.event.repository.default_branch &&
        github.actor == 'github-actions[bot]'
      }}
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout checkpoint pruning helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Prune superseded checkpoint generations
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_STAGE: ${{ needs.build.outputs.stage }}
          CHROMIUM_VERSION: ${{ needs.build.outputs.version }}
          SUPERSEDED_OLDER_RUN_ID: ${{ inputs.older_checkpoint_run_id }}
          SUPERSEDED_PREFERRED_RUN_ID: ${{ inputs.preferred_checkpoint_run_id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          failures=0
          prune_run() {
            local run_id="$1" expected_stage="$2" label="$3"
            [ -n "${run_id}" ] || return 0
            if ! python3 scripts/github_checkpoint_prune.py \
                --repository "${GITHUB_REPOSITORY}" \
                --run-id "${run_id}" \
                --version "${CHROMIUM_VERSION}" \
                --expected-stage "${expected_stage}" \
                --default-branch "${DEFAULT_BRANCH}" \
                --protect-run-id "${GITHUB_RUN_ID}"; then
              echo "::warning::Could not prune superseded ${label} checkpoint from run ${run_id}; retention cleanup is best-effort."
              failures=1
            fi
          }
          if [ "${CURRENT_STAGE}" -gt 2 ]; then
            prune_run "${SUPERSEDED_OLDER_RUN_ID}" "$((CURRENT_STAGE - 2))" older
          fi
          prune_run "${SUPERSEDED_PREFERRED_RUN_ID}" "${CURRENT_STAGE}" preferred
          exit "${failures}"

  report_terminal_failure:
    name: Record terminal port failure
    needs:
      - build
      - recover_bad_runner
    if: >-
      ${{
        always() &&
        (needs.build.result == 'failure' || needs.build.result == 'cancelled') &&
        github.ref_name == github.event.repository.default_branch &&
        needs.recover_bad_runner.result != 'success'
      }}
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout maintenance helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Open or update terminal maintenance issue
        env:
          GH_TOKEN: ${{ github.token }}
          CHROMIUM_VERSION: ${{ needs.build.outputs.version || inputs.version }}
          STAGE: ${{ needs.build.outputs.stage || inputs.stage || '1' }}
          RETRY_COUNT: ${{ needs.build.outputs.retry_count || inputs.retry_count || '0' }}
          FAILURE_CLASS: ${{ needs.build.outputs.failure_class || 'unknown' }}
        shell: bash
        run: |
          set -euo pipefail
          title="[i686-port] Chromium ${CHROMIUM_VERSION} requires maintenance"
          body_file="${RUNNER_TEMP}/chromium-i686-terminal-failure.md"
          cat > "${body_file}" <<EOF
          Chromium ${CHROMIUM_VERSION} reached a terminal Linux i686 pipeline failure.

          - Stage: ${STAGE}
          - Runner attempt: ${RETRY_COUNT}
          - Failure class: ${FAILURE_CLASS}
          - Build result: ${{ needs.build.result }}
          - Recovery job result: ${{ needs.recover_bad_runner.result }}
          - Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Workflow commit: ${GITHUB_SHA}

          The stable watcher also treats recent terminal workflow history as backup quarantine state. Use a forced/manual retry only after the underlying compatibility or infrastructure issue is addressed.
          EOF
          python3 scripts/github_maintenance_issue.py \
            --repository "${GITHUB_REPOSITORY}" \
            --title "${title}" \
            --body-file "${body_file}"
