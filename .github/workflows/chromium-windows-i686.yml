name: Chromium Windows i686 Build (Unofficial)
run-name: Chromium Windows i686 ${{ inputs.version }} - stage ${{ inputs.stage || '1' }} - attempt ${{ inputs.retry_count || '0' }}

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Compiler stage to run.
        required: false
        default: "1"
        type: string
      version:
        description: Exact pinned Chromium version.
        required: true
        type: string
      lineage_sha:
        description: Immutable workflow commit; omit only for a new manual lineage.
        required: false
        default: ""
        type: string
      preferred_checkpoint_run_id:
        description: Run containing a same-stage partial checkpoint.
        required: false
        default: ""
        type: string
      fallback_checkpoint_run_id:
        description: Run containing the previous completed stage checkpoint.
        required: false
        default: ""
        type: string
      older_checkpoint_run_id:
        description: Older retained checkpoint generation; automatic lineage only.
        required: false
        default: ""
        type: string
      retry_count:
        description: Automatic fresh-runner recovery counter.
        required: false
        default: "0"
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.ref_name == github.event.repository.default_branch && 'chromium-windows-i686-port-queue' || format('chromium-windows-i686-build-nonprod-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  JOB_CHECKPOINT_MINUTES: ${{ vars.CHROMIUM_WINDOWS_I686_CHECKPOINT_MINUTES || '325' }}
  CHROMIUM_WINDOWS_I686_NINJA_STALL_MINUTES: ${{ vars.CHROMIUM_WINDOWS_I686_NINJA_STALL_MINUTES || '90' }}
  CHROMIUM_WINDOWS_I686_JOBS: ${{ vars.CHROMIUM_WINDOWS_I686_JOBS || '4' }}
  CHECKPOINT_RETENTION_DAYS: "14"
  MAX_RUNNER_RETRIES: ${{ vars.CHROMIUM_WINDOWS_RUNNER_RETRIES || '2' }}
  MAX_COMPILER_STAGES: ${{ vars.CHROMIUM_WINDOWS_I686_MAX_STAGES || '20' }}

jobs:
  resolve_runner:
    name: Resolve tested Windows i686 runner
    permissions: {}
    uses: ./.github/workflows/resolve-windows-i686-production-runner.yml
    with:
      requested_runner: ${{ vars.CHROMIUM_WINDOWS_I686_RUNNER }}

  report_runner_configuration:
    name: Report invalid Windows runner configuration
    needs: resolve_runner
    if: ${{ always() && github.ref_name == github.event.repository.default_branch && (needs.resolve_runner.result != 'success' || needs.resolve_runner.outputs.valid != 'true') }}
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted maintenance helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record Windows runner configuration failure
        env:
          GH_TOKEN: ${{ github.token }}
          CHROMIUM_VERSION: ${{ inputs.version }}
          REQUESTED_RUNNER: ${{ vars.CHROMIUM_WINDOWS_I686_RUNNER }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${CHROMIUM_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            title="[windows-i686-port] Chromium ${CHROMIUM_VERSION} requires maintenance"
          else
            title="[windows-i686-port] Chromium pipeline requires maintenance"
          fi
          body_file="${RUNNER_TEMP}/chromium-windows-i686-runner.md"
          cat > "${body_file}" <<EOF
          Chromium Windows i686 runner selection failed before heavyweight work.

          - Requested runner: ${REQUESTED_RUNNER:-<default>}
          - Allowed labels: windows-2025-vs2026, windows-2025
          - Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          Update CHROMIUM_WINDOWS_I686_RUNNER only with a green Windows compatibility change.
          EOF
          python3 scripts/github_maintenance_issue.py --repository "${GITHUB_REPOSITORY}" --title "${title}" --body-file "${body_file}" || true
          exit 1

  build:
    name: Windows Build Stage ${{ inputs.stage || '1' }}
    needs: resolve_runner
    if: ${{ needs.resolve_runner.outputs.valid == 'true' }}
    runs-on: ${{ needs.resolve_runner.outputs.label }}
    timeout-minutes: 360
    outputs:
      stage: ${{ steps.control.outputs.stage }}
      max_stage: ${{ steps.control.outputs.max_stage }}
      version: ${{ steps.control.outputs.version }}
      lineage_sha: ${{ steps.control.outputs.lineage_sha }}
      retry_count: ${{ steps.control.outputs.retry_count }}
      max_retries: ${{ steps.control.outputs.max_retries }}
      complete: ${{ steps.compiler.outputs.complete }}
      failure_class: ${{ steps.compiler.outputs.failure_class || steps.control.outputs.failure_class }}
    steps:
      - name: Checkout immutable workflow helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve Windows stage controls
        id: control
        shell: pwsh
        env:
          REQUESTED_STAGE: ${{ inputs.stage }}
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_LINEAGE_SHA: ${{ inputs.lineage_sha }}
          REQUESTED_RETRY_COUNT: ${{ inputs.retry_count }}
          PREFERRED_RUN_ID: ${{ inputs.preferred_checkpoint_run_id }}
          FALLBACK_RUN_ID: ${{ inputs.fallback_checkpoint_run_id }}
          OLDER_RUN_ID: ${{ inputs.older_checkpoint_run_id }}
          CURRENT_REF: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          $ErrorActionPreference = 'Stop'
          function Fail-Control([string]$Message) {
            "failure_class=deterministic_build" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Error $Message
            exit 2
          }
          $stage = if ($env:REQUESTED_STAGE) { $env:REQUESTED_STAGE } else { '1' }
          $version = $env:REQUESTED_VERSION
          $lineage = if ($env:REQUESTED_LINEAGE_SHA) { $env:REQUESTED_LINEAGE_SHA.ToLowerInvariant() } else { $env:GITHUB_SHA.ToLowerInvariant() }
          $retry = if ($env:REQUESTED_RETRY_COUNT) { $env:REQUESTED_RETRY_COUNT } else { '0' }
          if ($env:GITHUB_SHA -notmatch '^[0-9a-fA-F]{40}$' -or $lineage -notmatch '^[0-9a-f]{40}$') { Fail-Control 'lineage_sha must be exactly 40 hexadecimal characters' }
          "lineage_sha=$lineage" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          if ($lineage -ne $env:GITHUB_SHA.ToLowerInvariant()) { Fail-Control "workflow lineage SHA drift: expected $lineage, current $env:GITHUB_SHA" }
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$') { Fail-Control 'version must use the form 153.0.8010.12' }
          if ($stage -notmatch '^[1-9][0-9]?$') { Fail-Control 'stage must be an integer from 1 through 50' }
          if ($env:MAX_COMPILER_STAGES -notmatch '^[1-9][0-9]?$') { Fail-Control 'CHROMIUM_WINDOWS_I686_MAX_STAGES must be 1 through 50' }
          if ([int]$env:MAX_COMPILER_STAGES -gt 50 -or [int]$stage -gt [int]$env:MAX_COMPILER_STAGES) { Fail-Control 'stage exceeds the bounded Windows stage policy' }
          if ($env:MAX_RUNNER_RETRIES -notmatch '^(0|[1-9]|10)$') { Fail-Control 'CHROMIUM_WINDOWS_RUNNER_RETRIES must be 0 through 10' }
          if ($retry -notmatch '^(0|[1-9]|10)$' -or [int]$retry -gt [int]$env:MAX_RUNNER_RETRIES) { Fail-Control 'retry_count exceeds the bounded runner retry policy' }
          if ($env:JOB_CHECKPOINT_MINUTES -notmatch '^[0-9]{2,3}$' -or [int]$env:JOB_CHECKPOINT_MINUTES -lt 30 -or [int]$env:JOB_CHECKPOINT_MINUTES -gt 325) { Fail-Control 'CHROMIUM_WINDOWS_I686_CHECKPOINT_MINUTES must be 30 through 325' }
          if ($env:CHROMIUM_WINDOWS_I686_NINJA_STALL_MINUTES -notmatch '^[0-9]{2,3}$' -or [int]$env:CHROMIUM_WINDOWS_I686_NINJA_STALL_MINUTES -lt 30 -or [int]$env:CHROMIUM_WINDOWS_I686_NINJA_STALL_MINUTES -gt 180) { Fail-Control 'CHROMIUM_WINDOWS_I686_NINJA_STALL_MINUTES must be 30 through 180' }
          if ($env:CHROMIUM_WINDOWS_I686_JOBS -notmatch '^[1-8]$') { Fail-Control 'CHROMIUM_WINDOWS_I686_JOBS must be 1 through 8' }
          if ($env:CURRENT_REF -ne $env:DEFAULT_BRANCH -and ($env:PREFERRED_RUN_ID -or $env:FALLBACK_RUN_ID -or $env:OLDER_RUN_ID)) { Fail-Control 'Non-default branch validation cannot import production checkpoints' }
          "stage=$stage" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "max_stage=$env:MAX_COMPILER_STAGES" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "retry_count=$retry" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "max_retries=$env:MAX_RUNNER_RETRIES" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "failure_class=" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Run resumable Windows compiler stage
        id: compiler
        uses: ./.github/actions/chromium-windows-i686-stage
        with:
          stage: ${{ steps.control.outputs.stage }}
          attempt: ${{ steps.control.outputs.retry_count == '0' && 'primary' || format('recovery-{0}', steps.control.outputs.retry_count) }}
          version: ${{ steps.control.outputs.version }}
          lineage-sha: ${{ steps.control.outputs.lineage_sha }}
          expected-ref: ${{ github.ref_name }}
          preferred-checkpoint-run-id: ${{ inputs.preferred_checkpoint_run_id }}
          fallback-checkpoint-run-id: ${{ inputs.fallback_checkpoint_run_id }}
          final-stage: ${{ steps.control.outputs.stage == steps.control.outputs.max_stage && 'true' || 'false' }}

  continue_pipeline:
    name: Dispatch next Windows compiler stage
    needs: build
    if: ${{ needs.build.result == 'success' && needs.build.outputs.complete != 'true' && github.ref_name == github.event.repository.default_branch && fromJSON(needs.build.outputs.stage) < fromJSON(needs.build.outputs.max_stage) }}
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout immutable dispatch helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Start next Windows stage exactly once
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_STAGE: ${{ needs.build.outputs.stage }}
          CHROMIUM_VERSION: ${{ needs.build.outputs.version }}
          LINEAGE_SHA: ${{ needs.build.outputs.lineage_sha }}
          FALLBACK_RUN_ID: ${{ inputs.fallback_checkpoint_run_id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          next_stage=$((CURRENT_STAGE + 1))
          expected_title="Chromium Windows i686 ${CHROMIUM_VERSION} - stage ${next_stage} - attempt 0"
          python3 scripts/github_workflow_dispatch.py \
            --repository "${GITHUB_REPOSITORY}" \
            --workflow chromium-windows-i686.yml \
            --ref "${DEFAULT_BRANCH}" \
            --expected-title "${expected_title}" \
            --expected-head-sha "${LINEAGE_SHA}" \
            --dedupe-completed \
            --dedupe-since-run-id "${GITHUB_RUN_ID}" \
            --input "stage=${next_stage}" \
            --input "version=${CHROMIUM_VERSION}" \
            --input "lineage_sha=${LINEAGE_SHA}" \
            --input "preferred_checkpoint_run_id=" \
            --input "fallback_checkpoint_run_id=${GITHUB_RUN_ID}" \
            --input "older_checkpoint_run_id=${FALLBACK_RUN_ID}" \
            --input "retry_count=0"
      - name: Prune superseded Windows checkpoint generation
        if: ${{ github.actor == 'github-actions[bot]' && inputs.older_checkpoint_run_id != '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CHROMIUM_VERSION: ${{ needs.build.outputs.version }}
          CURRENT_STAGE: ${{ needs.build.outputs.stage }}
          SUPERSEDED_RUN_ID: ${{ inputs.older_checkpoint_run_id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${CURRENT_STAGE}" -gt 2 ]; then
            python3 scripts/github_checkpoint_prune.py \
              --lane windows \
              --repository "${GITHUB_REPOSITORY}" \
              --run-id "${SUPERSEDED_RUN_ID}" \
              --version "${CHROMIUM_VERSION}" \
              --expected-stage "$((CURRENT_STAGE - 2))" \
              --default-branch "${DEFAULT_BRANCH}" \
              --protect-run-id "${GITHUB_RUN_ID}"
          fi

  dispatch_release_handoff:
    name: Dispatch Windows release handoff
    needs: build
    if: ${{ needs.build.result == 'success' && needs.build.outputs.complete == 'true' && github.ref_name == github.event.repository.default_branch }}
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout immutable release dispatcher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Start Windows release handoff exactly once
        env:
          GH_TOKEN: ${{ github.token }}
          CHROMIUM_VERSION: ${{ needs.build.outputs.version }}
          LINEAGE_SHA: ${{ needs.build.outputs.lineage_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          expected_title="Handoff Chromium Windows i686 ${CHROMIUM_VERSION} from build run ${GITHUB_RUN_ID}"
          python3 scripts/github_workflow_dispatch.py \
            --repository "${GITHUB_REPOSITORY}" \
            --workflow publish-windows-i686-release-handoff.yml \
            --ref "${DEFAULT_BRANCH}" \
            --expected-title "${expected_title}" \
            --expected-head-sha "${LINEAGE_SHA}" \
            --dedupe-completed \
            --dedupe-since-run-id "${GITHUB_RUN_ID}" \
            --input "build_run_id=${GITHUB_RUN_ID}" \
            --input "version=${CHROMIUM_VERSION}" \
            --input "lineage_sha=${LINEAGE_SHA}"

  recover_bad_runner:
    name: Recover Windows stage on a fresh runner
    needs: build
    if: ${{ always() && (needs.build.result == 'failure' || needs.build.result == 'cancelled') && github.ref_name == github.event.repository.default_branch && needs.build.outputs.failure_class != 'deterministic_build' }}
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout immutable dispatch helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Redispatch failed Windows stage exactly once
        env:
          GH_TOKEN: ${{ github.token }}
          STAGE: ${{ needs.build.outputs.stage || inputs.stage || '1' }}
          CHROMIUM_VERSION: ${{ needs.build.outputs.version || inputs.version }}
          LINEAGE_SHA: ${{ needs.build.outputs.lineage_sha || inputs.lineage_sha || github.sha }}
          RETRY_COUNT: ${{ needs.build.outputs.retry_count || inputs.retry_count || '0' }}
          MAX_RETRIES: ${{ needs.build.outputs.max_retries || vars.CHROMIUM_WINDOWS_RUNNER_RETRIES || '2' }}
          FALLBACK_RUN_ID: ${{ inputs.fallback_checkpoint_run_id }}
          OLDER_RUN_ID: ${{ inputs.older_checkpoint_run_id }}
          PARENT_ACTOR: ${{ github.actor }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          next_retry="$(python3 scripts/chromium_runner_recovery.py --version "${CHROMIUM_VERSION}" --stage "${STAGE}" --retry-count "${RETRY_COUNT}" --max-retries "${MAX_RETRIES}")"
          trusted_older=""
          if [ "${PARENT_ACTOR}" = "github-actions[bot]" ]; then trusted_older="${OLDER_RUN_ID}"; fi
          expected_title="Chromium Windows i686 ${CHROMIUM_VERSION} - stage ${STAGE} - attempt ${next_retry}"
          python3 scripts/github_workflow_dispatch.py \
            --repository "${GITHUB_REPOSITORY}" \
            --workflow chromium-windows-i686.yml \
            --ref "${DEFAULT_BRANCH}" \
            --expected-title "${expected_title}" \
            --expected-head-sha "${LINEAGE_SHA}" \
            --dedupe-completed \
            --dedupe-since-run-id "${GITHUB_RUN_ID}" \
            --input "stage=${STAGE}" \
            --input "version=${CHROMIUM_VERSION}" \
            --input "lineage_sha=${LINEAGE_SHA}" \
            --input "preferred_checkpoint_run_id=${GITHUB_RUN_ID}" \
            --input "fallback_checkpoint_run_id=${FALLBACK_RUN_ID}" \
            --input "older_checkpoint_run_id=${trusted_older}" \
            --input "retry_count=${next_retry}"

  report_terminal_failure:
    name: Record terminal Windows port failure
    needs: [build, recover_bad_runner]
    if: ${{ always() && (needs.build.result == 'failure' || needs.build.result == 'cancelled') && github.ref_name == github.event.repository.default_branch && needs.recover_bad_runner.result != 'success' }}
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted maintenance helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Open or update Windows maintenance issue
        env:
          GH_TOKEN: ${{ github.token }}
          CHROMIUM_VERSION: ${{ needs.build.outputs.version || inputs.version }}
          STAGE: ${{ needs.build.outputs.stage || inputs.stage || '1' }}
          RETRY_COUNT: ${{ needs.build.outputs.retry_count || inputs.retry_count || '0' }}
          FAILURE_CLASS: ${{ needs.build.outputs.failure_class || 'unknown' }}
        shell: bash
        run: |
          set -euo pipefail
          title="[windows-i686-port] Chromium ${CHROMIUM_VERSION} requires maintenance"
          body_file="${RUNNER_TEMP}/chromium-windows-i686-terminal.md"
          cat > "${body_file}" <<EOF
          Chromium ${CHROMIUM_VERSION} reached a terminal Windows i686 pipeline failure.

          - Stage: ${STAGE}
          - Runner attempt: ${RETRY_COUNT}
          - Failure class: ${FAILURE_CLASS}
          - Build result: ${{ needs.build.result }}
          - Recovery result: ${{ needs.recover_bad_runner.result }}
          - Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Immutable workflow commit: ${GITHUB_SHA}

          The Windows watcher quarantines this exact version until the issue is resolved or a healthy immutable release supersedes it.
          EOF
          python3 scripts/github_maintenance_issue.py --repository "${GITHUB_REPOSITORY}" --title "${title}" --body-file "${body_file}"
