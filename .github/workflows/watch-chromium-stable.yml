name: Watch Chromium Stable for i686

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      force_version:
        description: "Optional exact Chromium version to preflight regardless of recorded state"
        required: false
        default: ""
        type: string
      dry_run:
        description: "Report what would be dispatched without starting a build"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: chromium-i686-stable-watcher
  cancel-in-progress: false

jobs:
  detect:
    if: ${{ github.ref_name == github.event.repository.default_branch }}
    permissions:
      contents: read
      actions: write
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout port metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Detect unprocessed stable releases
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_VERSION: ${{ inputs.force_version }}
          MANUAL_DRY_RUN: ${{ inputs.dry_run }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          dry_run=false
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${MANUAL_DRY_RUN}" = "true" ]; then
            dry_run=true
          fi

          args=(
            --repository "${GITHUB_REPOSITORY}"
            --ref "${DEFAULT_BRANCH}"
            --baseline support/baseline.json
            --max-new-builds 1
          )
          if [ -n "${FORCE_VERSION}" ]; then
            args+=(--force-version "${FORCE_VERSION}")
          fi
          if [ "${dry_run}" = "true" ]; then
            args+=(--dry-run)
          fi

          python3 scripts/chromium_stable_watcher.py "${args[@]}"

      - name: Clear recovered watcher maintenance issue
        if: ${{ success() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/github_maintenance_issue.py \
            --repository "${GITHUB_REPOSITORY}" \
            --title "[i686-port] Stable watcher requires maintenance" \
            --close-if-open \
            || echo "::warning::Watcher succeeded but recovered maintenance issue cleanup failed; future runs will retry it."

  report_watcher_failure:
    name: Report stable watcher failure
    needs: detect
    if: ${{ always() && needs.detect.result == 'failure' && github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout maintenance helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Open or update watcher maintenance issue
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          title="[i686-port] Stable watcher requires maintenance"
          body_file="${RUNNER_TEMP}/stable-watcher-failure.md"
          cat > "${body_file}" <<EOF
          The Chromium i686 stable watcher failed closed and dispatched no new work.

          - Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Workflow commit: ${GITHUB_SHA}

          This can indicate GitHub/API unavailability, schema drift, or a bounded state-history horizon that needs deliberate expansion. The next successful watcher run automatically closes this issue.
          EOF
          python3 scripts/github_maintenance_issue.py \
            --repository "${GITHUB_REPOSITORY}" \
            --title "${title}" \
            --body-file "${body_file}"
