name: Chromium i686 Compatibility Preflight
run-name: Chromium i686 preflight ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact Chromium stable version"
        required: true
        type: string
      dispatch_build:
        description: "Dispatch stage 1 when compatibility checks pass"
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  actions: write
  issues: write

concurrency:
  group: ${{ github.ref_name == github.event.repository.default_branch && 'chromium-i686-port-queue' || format('chromium-i686-preflight-nonprod-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  resolve_runner:
    name: Resolve tested i686 runner
    permissions: {}
    uses: ./.github/workflows/resolve-i686-production-runner.yml
    with:
      requested_runner: ${{ vars.CHROMIUM_I686_RUNNER }}

  report_runner_configuration:
    name: Report invalid i686 runner configuration
    needs: resolve_runner
    if: ${{ always() && github.ref_name == github.event.repository.default_branch && (needs.resolve_runner.result != 'success' || needs.resolve_runner.outputs.valid != 'true') }}
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted maintenance helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Record runner configuration failure
        env:
          GH_TOKEN: ${{ github.token }}
          CHROMIUM_VERSION: ${{ inputs.version }}
          REQUESTED_RUNNER: ${{ vars.CHROMIUM_I686_RUNNER }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${CHROMIUM_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            title="[i686-port] Chromium ${CHROMIUM_VERSION} requires maintenance"
          else
            title="[i686-port] Chromium pipeline requires maintenance"
          fi
          body_file="${RUNNER_TEMP}/chromium-i686-runner-configuration.md"
          cat > "${body_file}" <<EOF
          Chromium i686 runner selection could not be validated before scheduling the heavyweight compatibility job.

          - Requested runner: ${REQUESTED_RUNNER}
          - Allowed explicit production labels: ubuntu-22.04, ubuntu-24.04
          - Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          Update CHROMIUM_I686_RUNNER only together with a green LTS compatibility-matrix change.
          EOF
          python3 scripts/github_maintenance_issue.py --repository "${GITHUB_REPOSITORY}" --title "${title}" --body-file "${body_file}" || true
          exit 1

  preflight:
    needs: resolve_runner
    if: ${{ github.ref_name == github.event.repository.default_branch && needs.resolve_runner.outputs.valid == 'true' }}
    permissions:
      actions: write
      contents: read
      issues: write
    runs-on: ${{ needs.resolve_runner.outputs.label }}
    timeout-minutes: 120
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - name: Checkout port infrastructure
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Validate requested version
        env:
          CHROMIUM_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${CHROMIUM_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::version must use the form 150.0.7871.186"
            exit 1
          }

      - name: Prepare source and toolchain
        env:
          CHROMIUM_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          source .github/scripts/chromium_i686_common.sh
          source .github/scripts/chromium_i686_port.sh

          maximize_runner_disk_space
          install_system_dependencies
          bounded_sudo_apt_get install -y file binutils
          install_i386_runtime_libraries
          prepare_chromium_source "${CHROMIUM_VERSION}"
          install_depot_tools
          install_chromium_clang
          install_i386_sysroot
          apply_i686_port_patches "${CHROMIUM_VERSION}"
          write_lastchange
          configure_ccache
          install_gn_from_cipd
          configure_gn
          run_i686_compatibility_preflight
          run_extended_i686_preflight

      - name: Quarantine failed preflight
        if: ${{ failure() && github.ref_name == github.event.repository.default_branch }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CHROMIUM_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "${CHROMIUM_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::warning::Not creating a maintenance issue for invalid Chromium version input: ${CHROMIUM_VERSION}"
            exit 0
          fi
          title="[i686-port] Chromium ${CHROMIUM_VERSION} requires maintenance"
          body_file="${RUNNER_TEMP}/i686-preflight-failure.md"
          cat > "${body_file}" <<EOF
          Chromium ${CHROMIUM_VERSION} compatibility preflight failed. Automatic watcher redispatch is quarantined until this version is explicitly retried after a fix.

          - Workflow: ${GITHUB_WORKFLOW}
          - Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Source commit: ${GITHUB_SHA}

          Failed workflow history is itself treated as quarantine state, so this issue is a human-visible mirror rather than the only loop-prevention mechanism.
          EOF

          python3 scripts/github_maintenance_issue.py \
            --repository "${GITHUB_REPOSITORY}" \
            --title "${title}" \
            --body-file "${body_file}"

      - name: Upload preflight evidence
        if: ${{ success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chromium-${{ inputs.version }}-linux-i686-preflight
          path: i686-preflight-ninja-query.txt
          retention-days: 30
          if-no-files-found: error

      - name: Dispatch resumable build
        if: ${{ success() && inputs.dispatch_build && github.ref_name == github.event.repository.default_branch }}
        env:
          GH_TOKEN: ${{ github.token }}
          CHROMIUM_VERSION: ${{ inputs.version }}
          LINEAGE_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          expected_title="Chromium i686 ${CHROMIUM_VERSION} - stage 1 - attempt 0"
          python3 scripts/github_workflow_dispatch.py \
            --repository "${GITHUB_REPOSITORY}" \
            --workflow chromium-i686.yml \
            --ref "${DEFAULT_BRANCH}" \
            --expected-title "${expected_title}" \
            --expected-head-sha "${LINEAGE_SHA}" \
            --input "stage=1" \
            --input "version=${CHROMIUM_VERSION}" \
            --input "lineage_sha=${LINEAGE_SHA}" \
            --input "preferred_checkpoint_run_id=" \
            --input "fallback_checkpoint_run_id=" \
            --input "retry_count=0"
