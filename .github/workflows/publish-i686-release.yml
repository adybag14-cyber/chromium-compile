name: Publish Chromium i686 Release
run-name: Publish ${{ github.event.workflow_run.display_title || format('Chromium i686 {0} from build run {1}', inputs.version, inputs.build_run_id) }}

on:
  workflow_run:
    workflows:
      - Chromium i686 Build (Unofficial Port)
    types:
      - completed
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "Successful Chromium i686 build run ID to republish without recompiling"
        required: true
        type: string
      version:
        description: "Exact Chromium version expected from the selected build run"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # Release mutation is rare and correctness-sensitive. Serialize all publishers so
  # two successful build runs can never race on the same version tag/draft.
  group: ${{ (github.event_name == 'workflow_run' || github.ref_name == github.event.repository.default_branch) && 'chromium-i686-release' || format('chromium-i686-release-nonprod-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  validate:
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch) ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == github.event.repository.default_branch &&
          github.event.workflow_run.head_repository.full_name == github.repository
        )
      }}
    permissions:
      actions: read
      contents: read
    outputs:
      found: ${{ steps.artifact.outputs.found }}
      artifact_name: ${{ steps.artifact.outputs.name }}
      version: ${{ steps.artifact.outputs.version }}
      run_id: ${{ steps.source.outputs.run_id }}
      head_sha: ${{ steps.source.outputs.head_sha }}
      package_sha: ${{ steps.verified.outputs.package_sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout trusted release helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Install release validation tools
        shell: bash
        run: |
          set -euo pipefail
          source .github/scripts/chromium_i686_common.sh
          bounded_sudo_apt_get update
          bounded_sudo_apt_get install -y --no-install-recommends jq python3 file binutils xz-utils

      - name: Resolve and verify trusted build source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RUN_ID: ${{ github.event.workflow_run.id || inputs.build_run_id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          source .github/scripts/chromium_i686_common.sh
          [[ "${REQUESTED_RUN_ID}" =~ ^[1-9][0-9]{0,19}$ ]] || {
            echo "::error::build_run_id must be a positive GitHub Actions run ID with at most 20 digits"
            exit 1
          }
          run_json="$(bounded_gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${REQUESTED_RUN_ID}")"
          status="$(jq -r '.status // ""' <<<"${run_json}")"
          conclusion="$(jq -r '.conclusion // ""' <<<"${run_json}")"
          workflow_path="$(jq -r '.path // ""' <<<"${run_json}")"
          head_branch="$(jq -r '.head_branch // ""' <<<"${run_json}")"
          head_repo="$(jq -r '.head_repository.full_name // ""' <<<"${run_json}")"
          head_sha="$(jq -r '.head_sha // ""' <<<"${run_json}")"
          display_title="$(jq -r '.display_title // ""' <<<"${run_json}")"

          test "${status}" = completed || {
            echo "::error::Build run ${REQUESTED_RUN_ID} is not completed."
            exit 1
          }
          test "${conclusion}" = success || {
            echo "::error::Build run ${REQUESTED_RUN_ID} did not conclude successfully."
            exit 1
          }
          test "${workflow_path}" = ".github/workflows/chromium-i686.yml" || {
            echo "::error::Run ${REQUESTED_RUN_ID} is not the trusted Chromium i686 build workflow."
            exit 1
          }
          test "${head_branch}" = "${DEFAULT_BRANCH}" || {
            echo "::error::Run ${REQUESTED_RUN_ID} did not build the repository default branch."
            exit 1
          }
          test "${head_repo}" = "${GITHUB_REPOSITORY}" || {
            echo "::error::Run ${REQUESTED_RUN_ID} originated from ${head_repo}, not ${GITHUB_REPOSITORY}."
            exit 1
          }
          [[ "${head_sha}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Run ${REQUESTED_RUN_ID} has an invalid head SHA."
            exit 1
          }
          echo "run_id=${REQUESTED_RUN_ID}" >> "${GITHUB_OUTPUT}"
          echo "head_sha=${head_sha}" >> "${GITHUB_OUTPUT}"
          delimiter="display_title_$(python3 -c 'import uuid; print(uuid.uuid4().hex)')"
          {
            printf 'display_title<<%s\n' "${delimiter}"
            printf '%s\n' "${display_title}"
            printf '%s\n' "${delimiter}"
          } >> "${GITHUB_OUTPUT}"

      - name: Discover completed build artifact
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.source.outputs.run_id }}
          BUILD_DISPLAY_TITLE: ${{ steps.source.outputs.display_title }}
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          source .github/scripts/chromium_i686_common.sh
          expected_version="$(sed -nE 's/^Chromium i686 ([0-9]+\.[0-9]+\.[0-9]+\.[0-9]+).*/\1/p' <<<"${BUILD_DISPLAY_TITLE}")"
          [[ "${expected_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Could not extract Chromium version from build run title: ${BUILD_DISPLAY_TITLE}"
            exit 1
          }
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            [[ "${REQUESTED_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              echo "::error::Manual republish version must use the exact Chromium version format."
              exit 1
            }
            test "${REQUESTED_VERSION}" = "${expected_version}" || {
              echo "::error::Manual republish requested Chromium ${REQUESTED_VERSION}, but build run ${RUN_ID} is ${expected_version}."
              exit 1
            }
          fi

          artifacts_json="$(bounded_gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts?per_page=100")"
          total="$(jq -er '.total_count | numbers' <<<"${artifacts_json}")" || {
            echo "::error::Build artifact listing returned malformed total_count metadata."
            exit 1
          }
          [[ "${total}" =~ ^(0|[1-9][0-9]{0,2})$ ]] || {
            echo "::error::Build run ${RUN_ID} artifact count is outside the bounded 0..100 lookup contract: ${total}"
            exit 1
          }
          if [ "${total}" -gt 100 ]; then
            echo "::error::Build run ${RUN_ID} has more than 100 artifacts; refusing truncated artifact discovery."
            exit 1
          fi
          match_count="$(jq -er '[.artifacts[]? | select(.expired == false and (.name | test("^chromium-[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+-linux-i686$")))] | length' <<<"${artifacts_json}")"

          if [ "${match_count}" -eq 0 ]; then
            if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
              echo "::error::Requested build run ${RUN_ID} has no retained final Chromium runtime artifact."
              exit 1
            fi
            echo "found=false" >> "${GITHUB_OUTPUT}"
            echo "This compiler stage did not produce the final runtime artifact."
            exit 0
          fi
          if [ "${match_count}" -ne 1 ]; then
            echo "::error::Expected exactly one final Chromium artifact; found ${match_count}."
            jq -r '.artifacts[]? | select(.expired == false) | .name' <<<"${artifacts_json}"
            exit 1
          fi

          artifact_name="$(jq -er '[.artifacts[]? | select(.expired == false and (.name | test("^chromium-[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+-linux-i686$")))] | .[0].name | strings' <<<"${artifacts_json}")"
          artifact_size="$(jq -er '[.artifacts[]? | select(.expired == false and (.name | test("^chromium-[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+-linux-i686$")))] | .[0].size_in_bytes | numbers' <<<"${artifacts_json}")" || {
            echo "::error::Final Chromium build artifact lacks valid size_in_bytes metadata."
            exit 1
          }
          size_status=0
          validate_artifact_size_bytes \
            "${artifact_size}" "${CHROMIUM_I686_MAX_RELEASE_ARTIFACT_GIB}" \
            CHROMIUM_I686_MAX_RELEASE_ARTIFACT_GIB "${CHROMIUM_I686_HARD_MAX_RELEASE_ARTIFACT_GIB}" \
            || size_status=$?
          if [ "${size_status}" -ne 0 ]; then
            echo "::error::Final Chromium build artifact violates compressed artifact size policy."
            exit 1
          fi

          version="${artifact_name#chromium-}"
          version="${version%-linux-i686}"
          test "${version}" = "${expected_version}" || {
            echo "::error::Artifact Chromium version ${version} does not match triggering build ${expected_version}."
            exit 1
          }
          echo "found=true" >> "${GITHUB_OUTPUT}"
          echo "name=${artifact_name}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "size_bytes=${artifact_size}" >> "${GITHUB_OUTPUT}"
          echo "name=${artifact_name}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Download completed artifact
        if: ${{ steps.artifact.outputs.found == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.source.outputs.run_id }}
          ARTIFACT_NAME: ${{ steps.artifact.outputs.name }}
        shell: bash
        run: |
          set -euo pipefail
          source .github/scripts/chromium_i686_common.sh
          bounded_gh run download "${RUN_ID}"             --repo "${GITHUB_REPOSITORY}"             --name "${ARTIFACT_NAME}"             --dir release-assets

      - name: Validate provenance, checksum and i686 structure
        id: verified
        if: ${{ steps.artifact.outputs.found == 'true' }}
        env:
          CHROMIUM_VERSION: ${{ steps.artifact.outputs.version }}
          BUILD_SHA: ${{ steps.source.outputs.head_sha }}
          BUILD_RUN_ID: ${{ steps.source.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          source .github/scripts/chromium_i686_common.sh
          package="release-assets/chromium-${CHROMIUM_VERSION}-linux-i686.tar.xz"
          checksum="${package}.sha256"
          manifest="release-assets/chromium-${CHROMIUM_VERSION}-linux-i686-manifest.txt"
          test -s "${package}"
          test -s "${checksum}"
          test -s "${manifest}"
          grep -qx "version=${CHROMIUM_VERSION}" "${manifest}"
          grep -qx "target_cpu=x86" "${manifest}"
          grep -qx "target_os=linux" "${manifest}"
          grep -qx "github_sha=${BUILD_SHA}" "${manifest}"
          grep -qx "github_run_id=${BUILD_RUN_ID}" "${manifest}"

          expected="$(awk 'NR == 1 {print $1}' "${checksum}")"
          checksum_name="$(awk 'NR == 1 {print $2}' "${checksum}")"
          actual="$(sha256sum "${package}" | awk '{print $1}')"
          manifest_sha="$(awk -F= '$1 == "package_sha256" {print $2}' "${manifest}")"
          echo "Expected package SHA-256: ${expected}"
          echo "Actual package SHA-256:   ${actual}"
          test "${checksum_name}" = "$(basename "${package}")"
          test "${actual}" = "${expected}"
          test "${actual}" = "${manifest_sha}"

          release_stats="${RUNNER_TEMP}/release-archive-stats.json"
          validate_release_archive_with_stats "${package}" "${release_stats}"
          mkdir release-runtime
          ensure_release_archive_extract_space "${release_stats}" release-runtime
          bounded_external "${CHROMIUM_I686_ARCHIVE_TIMEOUT_SECONDS}" \
            tar -xJf "${package}" -C release-runtime
          validate_i686_runtime_bundle release-runtime
          echo "package_sha=${actual}" >> "${GITHUB_OUTPUT}"

  smoke:
    needs: validate
    if: ${{ needs.validate.result == 'success' && needs.validate.outputs.found == 'true' }}
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout trusted release helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Install target runtime smoke dependencies
        shell: bash
        run: |
          set -euo pipefail
          source .github/scripts/chromium_i686_common.sh
          bounded_sudo_apt_get update
          bounded_sudo_apt_get install -y --no-install-recommends jq python3 file binutils xz-utils
          install_i386_runtime_libraries

      - name: Download validated build artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ needs.validate.outputs.run_id }}
          ARTIFACT_NAME: ${{ needs.validate.outputs.artifact_name }}
        shell: bash
        run: |
          set -euo pipefail
          source .github/scripts/chromium_i686_common.sh
          bounded_gh run download "${RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "${ARTIFACT_NAME}" \
            --dir release-assets

      - name: Execute validated i686 runtime
        env:
          CHROMIUM_VERSION: ${{ needs.validate.outputs.version }}
          BUILD_SHA: ${{ needs.validate.outputs.head_sha }}
          BUILD_RUN_ID: ${{ needs.validate.outputs.run_id }}
          VALIDATED_PACKAGE_SHA: ${{ needs.validate.outputs.package_sha }}
        shell: bash
        run: |
          set -euo pipefail
          source .github/scripts/chromium_i686_common.sh
          package="release-assets/chromium-${CHROMIUM_VERSION}-linux-i686.tar.xz"
          checksum="${package}.sha256"
          manifest="release-assets/chromium-${CHROMIUM_VERSION}-linux-i686-manifest.txt"
          test -s "${package}"
          test -s "${checksum}"
          test -s "${manifest}"
          actual="$(sha256sum "${package}" | awk '{print $1}')"
          test "${actual}" = "${VALIDATED_PACKAGE_SHA}"
          grep -qx "version=${CHROMIUM_VERSION}" "${manifest}"
          grep -qx "github_sha=${BUILD_SHA}" "${manifest}"
          grep -qx "github_run_id=${BUILD_RUN_ID}" "${manifest}"
          expected="$(awk 'NR == 1 {print $1}' "${checksum}")"
          manifest_sha="$(awk -F= '$1 == "package_sha256" {print $2}' "${manifest}")"
          test "${actual}" = "${expected}"
          test "${actual}" = "${manifest_sha}"
          release_stats="${RUNNER_TEMP}/release-archive-stats.json"
          validate_release_archive_with_stats "${package}" "${release_stats}"
          mkdir release-runtime
          ensure_release_archive_extract_space "${release_stats}" release-runtime
          bounded_external "${CHROMIUM_I686_ARCHIVE_TIMEOUT_SECONDS}" \
            tar -xJf "${package}" -C release-runtime
          validate_i686_runtime_bundle release-runtime
          smoke_test_i686_runtime_bundle release-runtime "${CHROMIUM_VERSION}"
          echo "Read-only runtime smoke passed for Chromium ${CHROMIUM_VERSION}."

  report_validation_failure:
    needs: [validate, smoke]
    if: ${{ always() && (needs.validate.result == 'failure' || needs.smoke.result == 'failure') }}
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted maintenance helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Report read-only release validation failure
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATION_RESULT: ${{ needs.validate.result }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
          VALIDATED_VERSION: ${{ needs.validate.outputs.version }}
          REQUESTED_VERSION: ${{ inputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          version="${VALIDATED_VERSION:-${REQUESTED_VERSION:-}}"
          if [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            title="[i686-port] Chromium ${version} requires maintenance"
          else
            version=unknown
            title="[i686-port] Chromium pipeline requires maintenance"
          fi
          body_file="${RUNNER_TEMP}/release-readonly-validation-failure.md"
          cat > "${body_file}" <<EOF
          Trusted release validation failed before the write-capable publication job was allowed to start.

          - Release workflow: ${RUN_URL}
          - Chromium version: ${version}
          - Metadata/structure validation: ${VALIDATION_RESULT}
          - Runtime smoke: ${SMOKE_RESULT}

          No release/tag mutation was attempted by the failing validation path.
          EOF
          python3 scripts/github_maintenance_issue.py \
            --repository "${GITHUB_REPOSITORY}" \
            --title "${title}" \
            --body-file "${body_file}"

  publish:
    needs: [validate, smoke]
    if: ${{ needs.validate.result == 'success' && needs.smoke.result == 'success' && needs.validate.outputs.found == 'true' }}
    permissions:
      actions: read
      contents: write
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout trusted release helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Install publication validation tools
        shell: bash
        run: |
          set -euo pipefail
          source .github/scripts/chromium_i686_common.sh
          bounded_sudo_apt_get update
          bounded_sudo_apt_get install -y --no-install-recommends jq python3

      - name: Download completed artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ needs.validate.outputs.run_id }}
          ARTIFACT_NAME: ${{ needs.validate.outputs.artifact_name }}
        shell: bash
        run: |
          set -euo pipefail
          source .github/scripts/chromium_i686_common.sh
          bounded_gh run download "${RUN_ID}"             --repo "${GITHUB_REPOSITORY}"             --name "${ARTIFACT_NAME}"             --dir release-assets

      - name: Reverify provenance, checksum and i686 structure before mutation
        env:
          CHROMIUM_VERSION: ${{ needs.validate.outputs.version }}
          BUILD_SHA: ${{ needs.validate.outputs.head_sha }}
          BUILD_RUN_ID: ${{ needs.validate.outputs.run_id }}
          VALIDATED_PACKAGE_SHA: ${{ needs.validate.outputs.package_sha }}
        shell: bash
        run: |
          set -euo pipefail
          source .github/scripts/chromium_i686_common.sh
          package="release-assets/chromium-${CHROMIUM_VERSION}-linux-i686.tar.xz"
          checksum="${package}.sha256"
          manifest="release-assets/chromium-${CHROMIUM_VERSION}-linux-i686-manifest.txt"
          test -s "${package}"
          test -s "${checksum}"
          test -s "${manifest}"
          grep -qx "version=${CHROMIUM_VERSION}" "${manifest}"
          grep -qx "target_cpu=x86" "${manifest}"
          grep -qx "target_os=linux" "${manifest}"
          grep -qx "github_sha=${BUILD_SHA}" "${manifest}"
          grep -qx "github_run_id=${BUILD_RUN_ID}" "${manifest}"

          expected="$(awk 'NR == 1 {print $1}' "${checksum}")"
          checksum_name="$(awk 'NR == 1 {print $2}' "${checksum}")"
          actual="$(sha256sum "${package}" | awk '{print $1}')"
          manifest_sha="$(awk -F= '$1 == "package_sha256" {print $2}' "${manifest}")"
          echo "Expected package SHA-256: ${expected}"
          echo "Actual package SHA-256:   ${actual}"
          test "${checksum_name}" = "$(basename "${package}")"
          test "${actual}" = "${expected}"
          test "${actual}" = "${manifest_sha}"
          test "${actual}" = "${VALIDATED_PACKAGE_SHA}"

      - name: Create or resume transactional immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          CHROMIUM_VERSION: ${{ needs.validate.outputs.version }}
          BUILD_SHA: ${{ needs.validate.outputs.head_sha }}
          BUILD_RUN_ID: ${{ needs.validate.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          source .github/scripts/chromium_i686_common.sh
          tag="chromium-${CHROMIUM_VERSION}-linux-i686"
          title="Chromium ${CHROMIUM_VERSION} Linux i686 (Unofficial)"
          notes="Unofficial downstream Linux i686 build of Chromium ${CHROMIUM_VERSION}. Chromium upstream does not support or test this target. Built and ELF32-validated by GitHub Actions run ${BUILD_RUN_ID} from commit ${BUILD_SHA}."
          assets=(
            "release-assets/chromium-${CHROMIUM_VERSION}-linux-i686.tar.xz"
            "release-assets/chromium-${CHROMIUM_VERSION}-linux-i686.tar.xz.sha256"
            "release-assets/chromium-${CHROMIUM_VERSION}-linux-i686-manifest.txt"
          )

          tag_state="$(python3 scripts/github_release_tag.py \
            --repository "${GITHUB_REPOSITORY}" --tag "${tag}" --sha "${BUILD_SHA}")"
          echo "Verified exact release tag ${tag} -> ${BUILD_SHA} (${tag_state})."

          release_asset_digest() {
            local json="${1:?release json is required}"
            local name="${2:?asset name is required}"
            local count digest
            count="$(jq -r --arg name "${name}" '[.assets[] | select(.name == $name)] | length' <<<"${json}")"
            if [ "${count}" -eq 0 ]; then
              return 4
            fi
            if [ "${count}" -ne 1 ]; then
              echo "::error::Release contains ${count} assets named ${name}; refusing ambiguous publication state." >&2
              return 1
            fi
            digest="$(jq -r --arg name "${name}" '.assets[] | select(.name == $name) | .digest // empty' <<<"${json}")"
            if [ -z "${digest}" ]; then
              echo "::error::GitHub did not expose a SHA-256 digest for existing release asset ${name}; required release-digest capability is unavailable." >&2
              return 2
            fi
            printf '%s\n' "${digest}"
          }

          release_json=""
          release_state="$(python3 scripts/github_release_state.py \
            --repository "${GITHUB_REPOSITORY}" --tag "${tag}")"
          if [ "${release_state}" = "exists" ]; then
            release_json="$(bounded_gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" --json isDraft,targetCommitish,assets)"
            is_draft="$(jq -r '.isDraft' <<<"${release_json}")"
          elif [ "${release_state}" = "missing" ]; then
            is_draft=true
            echo "Creating draft ${tag}; exact tag provenance is already pinned to ${BUILD_SHA}."
            if ! bounded_gh release create "${tag}" \
                --repo "${GITHUB_REPOSITORY}" \
                --draft \
                --title "${title}" \
                --notes "${notes}"; then
              echo "::warning::Draft create returned an error; checking whether GitHub accepted it before failing."
            fi
            release_json="$(bounded_gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" --json isDraft,targetCommitish,assets)"
            is_draft="$(jq -r '.isDraft' <<<"${release_json}")"
            test "${is_draft}" = true || {
              echo "::error::Unexpected published release appeared while creating ${tag}; refusing mutation."
              exit 1
            }
          else
            echo "::error::Unexpected release-state helper result: ${release_state}"
            exit 1
          fi

          if [ "${is_draft}" = false ]; then
            existing_commit="$(bounded_gh api "repos/${GITHUB_REPOSITORY}/commits/${tag}" --jq .sha)"
            test "${existing_commit}" = "${BUILD_SHA}" || {
              echo "::error::Published release ${tag} points to ${existing_commit}, not build ${BUILD_SHA}; refusing to rewrite release history."
              exit 1
            }
            for asset in "${assets[@]}"; do
              name="$(basename "${asset}")"
              local_digest="sha256:$(sha256sum "${asset}" | awk '{print $1}')"
              if ! remote_digest="$(release_asset_digest "${release_json}" "${name}")"; then
                echo "::error::Published release asset ${name} is missing or lacks verifiable digest metadata; immutable releases are never mutated in place."
                exit 1
              fi
              if [ "${remote_digest}" != "${local_digest}" ]; then
                echo "::error::Published release asset ${name} differs from the validated local artifact; immutable releases are never mutated in place."
                exit 1
              fi
            done
            echo "Published ${tag} is commit- and byte-identical; leaving immutable release untouched."
          else
            draft_target="$(jq -r '.targetCommitish // ""' <<<"${release_json}")"
            echo "Draft API target_commitish=${draft_target:-unset}; exact provenance is enforced by verified Git ref ${tag} -> ${BUILD_SHA}."

            # Drafts are resumable. Upload only a missing asset. An existing asset
            # must already be byte-identical; differing bytes are never overwritten.
            for asset in "${assets[@]}"; do
              name="$(basename "${asset}")"
              local_digest="sha256:$(sha256sum "${asset}" | awk '{print $1}')"
              release_json="$(bounded_gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" --json isDraft,targetCommitish,assets)"
              digest_status=0
              if remote_digest="$(release_asset_digest "${release_json}" "${name}")"; then
                :
              else
                digest_status=$?
                if [ "${digest_status}" -ne 4 ]; then
                  exit 1
                fi
                echo "Uploading missing draft asset ${name}."
                if ! bounded_gh release upload "${tag}" "${asset}" --repo "${GITHUB_REPOSITORY}"; then
                  echo "::warning::Upload returned an error; verifying whether GitHub stored ${name}."
                fi
                release_json="$(bounded_gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" --json isDraft,targetCommitish,assets)"
                if ! remote_digest="$(release_asset_digest "${release_json}" "${name}")"; then
                  echo "::error::Uploaded draft asset ${name} is not present with verifiable digest metadata."
                  exit 1
                fi
              fi
              if [ "${remote_digest}" != "${local_digest}" ]; then
                echo "::error::Draft asset ${name} differs from the validated local artifact; refusing overwrite."
                exit 1
              fi
            done

            release_json="$(bounded_gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" --json isDraft,targetCommitish,assets)"
            for asset in "${assets[@]}"; do
              name="$(basename "${asset}")"
              local_digest="sha256:$(sha256sum "${asset}" | awk '{print $1}')"
              if ! remote_digest="$(release_asset_digest "${release_json}" "${name}")"; then
                echo "::error::Draft asset ${name} lost required digest metadata before publication."
                exit 1
              fi
              test "${remote_digest}" = "${local_digest}"
            done

            echo "All draft assets are byte-identical; re-verifying exact tag provenance before publication."
            prepublish_tag_state="$(python3 scripts/github_release_tag.py \
              --repository "${GITHUB_REPOSITORY}" --tag "${tag}" --sha "${BUILD_SHA}")"
            echo "Pre-publication tag verification: ${prepublish_tag_state}."
            echo "Publishing ${tag}."
            if ! bounded_gh release edit "${tag}" --repo "${GITHUB_REPOSITORY}" --draft=false; then
              echo "::warning::Publish transition returned an error; verifying final release state."
            fi
            release_json="$(bounded_gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" --json isDraft,assets)"
            test "$(jq -r '.isDraft' <<<"${release_json}")" = false
            published_commit="$(bounded_gh api "repos/${GITHUB_REPOSITORY}/commits/${tag}" --jq .sha)"
            test "${published_commit}" = "${BUILD_SHA}"
          fi

          maintenance_title="[i686-port] Chromium ${CHROMIUM_VERSION} requires maintenance"
          if ! python3 scripts/github_maintenance_issue.py \
              --repository "${GITHUB_REPOSITORY}" \
              --title "${maintenance_title}" \
              --close-if-open; then
            echo "::warning::Release succeeded but maintenance issue cleanup failed; a later watcher/release run can retry cleanup."
          fi

      - name: Report release publication failure
        if: ${{ failure() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CHROMIUM_VERSION: ${{ needs.validate.outputs.version || 'unknown' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          title="[i686-port] Chromium ${CHROMIUM_VERSION} requires maintenance"
          body_file="${RUNNER_TEMP}/release-publication-failure.md"
          cat > "${body_file}" <<EOF
          The build artifact reached the trusted release workflow, but provenance, runtime validation, or immutable publication failed.

          - Release workflow: ${RUN_URL}
          - Chromium version: ${CHROMIUM_VERSION}
          EOF
          python3 scripts/github_maintenance_issue.py \
            --repository "${GITHUB_REPOSITORY}" \
            --title "${title}" \
            --body-file "${body_file}"
