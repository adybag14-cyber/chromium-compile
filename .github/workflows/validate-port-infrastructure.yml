name: Validate i686 Port Infrastructure

on:
  pull_request:
    paths:
      - ".github/**"
      - "docs/MAINTENANCE.md"
      - "patches/**"
      - "scripts/**"
      - "support/**"
      - "tests/**"
  workflow_dispatch:
    inputs:
      full_version:
        description: "Optional exact Chromium version for a full source/toolchain/i686 compatibility proof without dispatching a build"
        required: false
        default: ""
        type: string
      checkpoint_run_id:
        description: "Optional production Actions run ID whose checkpoint artifact should be recovery-drilled"
        required: false
        default: ""
        type: string
      checkpoint_version:
        description: "Chromium version expected in the checkpoint drill"
        required: false
        default: ""
        type: string
      checkpoint_consumer_stage:
        description: "Stage that would consume the checkpoint"
        required: false
        default: ""
        type: string
      checkpoint_artifact_stage:
        description: "Producer stage encoded in chromium-i686-out-stage-N"
        required: false
        default: ""
        type: string
      release_smoke_version:
        description: "Optional published Chromium version whose immutable i686 release should be launched on a real Ubuntu runner"
        required: false
        default: ""
        type: string
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read

jobs:
  resolve_production_runner:
    name: Resolve tested production i686 runner
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      label: ${{ steps.resolve.outputs.label }}
    steps:
      - name: Validate configured explicit LTS runner label
        id: resolve
        env:
          REQUESTED_RUNNER: ${{ vars.CHROMIUM_I686_RUNNER || 'ubuntu-24.04' }}
        shell: bash
        run: |
          set -euo pipefail
          case "${REQUESTED_RUNNER}" in
            ubuntu-22.04|ubuntu-24.04)
              echo "label=${REQUESTED_RUNNER}" >> "${GITHUB_OUTPUT}"
              echo "Validated explicit Chromium i686 production runner: ${REQUESTED_RUNNER}"
              ;;
            *)
              echo "::error::Unsupported CHROMIUM_I686_RUNNER '${REQUESTED_RUNNER}'. Allowed explicit production labels: ubuntu-22.04, ubuntu-24.04. ubuntu-latest is matrix-only."
              exit 1
              ;;
          esac

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Python and unit tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q scripts patches tests
          python3 -m unittest discover -s tests -v
          python3 -m json.tool support/baseline.json >/dev/null

      - name: Validate shell helpers
        shell: bash
        run: |
          set -euo pipefail
          for script in .github/scripts/*.sh; do
            bash -n "${script}"
          done

      - name: Exercise i386 runtime repair contract
        shell: bash
        run: |
          set -euo pipefail
          bash tests/test_i386_runtime_repair.sh

      - name: Exercise APT mirror resilience contract
        shell: bash
        run: |
          set -euo pipefail
          bash tests/test_apt_mirror_resilience.sh

      - name: Exercise non-mutating runner cleanup contract
        shell: bash
        run: |
          set -euo pipefail
          bash tests/test_runner_cleanup_contract.sh

      - name: Exercise timeout policy ceiling contract
        shell: bash
        run: |
          set -euo pipefail
          bash tests/test_timeout_policy_ceiling.sh

      - name: Exercise Ninja progress stall contract
        shell: bash
        run: |
          set -euo pipefail
          bash tests/test_ninja_progress_stall.sh

      - name: Exercise source archive stats and capacity contract
        shell: bash
        run: |
          set -euo pipefail
          bash tests/test_source_archive_space.sh
          bash tests/test_system_dependencies.sh
          bash tests/test_source_trust_hosts.sh

      - name: Exercise prepare failure classification contract
        shell: bash
        run: |
          set -euo pipefail
          bash tests/test_prepare_failure_classification.sh

      - name: Exercise checkpoint cutoff contract
        shell: bash
        run: |
          set -euo pipefail
          bash tests/test_checkpoint_cutoff.sh

      - name: Exercise post-compile artifact integrity contract
        shell: bash
        run: |
          set -euo pipefail
          bash tests/test_post_compile_artifact_integrity.sh

      - name: Exercise checkpoint provenance contract
        shell: bash
        run: |
          set -euo pipefail
          bash tests/test_checkpoint_provenance.sh
          bash tests/test_checkpoint_restore_atomic.sh
          bash tests/test_checkpoint_residue_cleanup.sh
          bash tests/test_port_config_hash.sh

      - name: Exercise release runtime smoke contract
        shell: bash
        run: |
          set -euo pipefail
          bash tests/test_release_runtime_smoke.sh
          bash tests/test_release_archive_space.sh
          bash tests/test_runtime_executable_permissions.sh
          bash tests/test_resource_policy_ceiling.sh

      - name: Reject floating first-party action tags
        shell: bash
        run: |
          set -euo pipefail
          invalid_refs="$(grep -R -nE 'uses:[[:space:]]+actions/[^@]+@[^[:space:]#]+' .github \
            | grep -Ev 'uses:[[:space:]]+actions/[^@]+@[0-9a-f]{40}([[:space:]]*#.*)?$' || true)"
          if [ -n "${invalid_refs}" ]; then
            printf '%s\n' "${invalid_refs}"
            echo "::error::First-party GitHub Actions must be pinned to exact 40-character commit SHAs."
            exit 1
          fi

      - name: Smoke-test failure classification
        shell: bash
        run: |
          set -euo pipefail
          source .github/scripts/chromium_i686_common.sh
          temp="$(mktemp -d)"
          trap 'rm -rf "${temp}"' EXIT
          echo 'error while loading shared libraries: libfuture.so: cannot open shared object file' > "${temp}/runtime.log"
          echo 'fatal error: no member named future_api' > "${temp}/deterministic.log"
          echo 'No space left on device' > "${temp}/infrastructure.log"
          test "$(classify_build_failure "${temp}/runtime.log")" = runtime_environment
          test "$(classify_build_failure "${temp}/deterministic.log")" = deterministic_build
          test "$(classify_build_failure "${temp}/infrastructure.log")" = infrastructure

      - name: Smoke-test semantic patch
        shell: bash
        run: |
          set -euo pipefail
          temp="$(mktemp -d)"
          trap 'rm -rf "${temp}"' EXIT
          cat > "${temp}/BUILD.gn" <<'EOF'
          assert(
            is_valid_x86_target || target_cpu != "x86" || v8_target_cpu == "arm",
            "unsupported",
          )
          EOF
          mkdir -p "${temp}/tools/metrics"
          cat > "${temp}/tools/metrics/BUILD.gn" <<'EOF'
          if (path_exists("//.git")) {
            action("histograms_xml") {
            }
          }
          group("metrics_metadata") {
            if (generate_location_tags) {
              deps += [ ":histograms_xml" ]
            }
          }
          EOF
          python3 patches/common/enable_linux_i686.py \
            --source-root "${temp}" \
            --version 150.0.7871.186
          grep -q 'target_os == "linux"' "${temp}/BUILD.gn"
          grep -q 'if (path_exists("//.git"))' "${temp}/tools/metrics/BUILD.gn"
          ! grep -q 'if (generate_location_tags)' "${temp}/tools/metrics/BUILD.gn"


  validate_upstream_contract:
    name: Validate latest Chromium source contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve latest source-declared tool pins
        shell: bash
        run: |
          set -euo pipefail
          source .github/scripts/chromium_i686_common.sh
          version="$(resolve_latest_version)"
          echo "Probing Chromium ${version} source contract."
          source_metadata="${RUNNER_TEMP}/latest-chromium-source-object.json"
          source_cache_key="$(python3 scripts/chromium_source_object.py \
            --version "${version}" --metadata-out "${source_metadata}" --cache-key-only)"
          [[ "${source_cache_key}" =~ ^chromium-src-v4-${version}-[1-9][0-9]{0,39}$ ]] || {
            echo "::error::Latest Chromium source cache identity is malformed: ${source_cache_key}"
            exit 1
          }
          echo "Latest source cache identity: ${source_cache_key}"
          mkdir -p "${CHROMIUM_SRC}/chrome/installer/linux"
          for rel in DEPS chrome/installer/linux/BUILD.gn; do
            encoded="${RUNNER_TEMP}/$(basename "${rel}").b64"
            effective_url="$(bounded_external 120 curl --fail --location --retry 4 --retry-all-errors \
              --proto '=https' --proto-redir '=https' \
              --connect-timeout 20 --max-time 120 \
              --write-out '%{url_effective}' \
              "https://chromium.googlesource.com/chromium/src/+/refs/tags/${version}/${rel}?format=TEXT" \
              -o "${encoded}")"
            validate_effective_https_host "${effective_url}" chromium.googlesource.com
            base64 --decode "${encoded}" > "${CHROMIUM_SRC}/${rel}"
          done

          pins="$(python3 scripts/chromium_tool_pins.py --deps "${CHROMIUM_SRC}/DEPS")"
          echo "Resolved pins: ${pins}"
          python3 scripts/chromium_linux_runtime.py \
            --source-root "${CHROMIUM_SRC}" --validate-definition

          expected_depot="$(python3 scripts/chromium_tool_pins.py --deps "${CHROMIUM_SRC}/DEPS" --field depot_tools_revision)"
          expected_gn="$(python3 scripts/chromium_tool_pins.py --deps "${CHROMIUM_SRC}/DEPS" --field gn_version)"
          install_depot_tools
          test "$(git -C "${DEPOT_TOOLS}" rev-parse HEAD)" = "${expected_depot}"
          test -s "${DEPOT_TOOLS}/python3_bin_reldir.txt"
          "${DEPOT_TOOLS}/python-bin/python3" -c 'import sys; print(sys.version)'
          install_gn_from_cipd
          "${GN_BINARY}" --version
          test "$(chromium_gn_version)" = "${expected_gn}"

  validate_checkpoint_recovery:
    name: Validate real checkpoint recovery artifact
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' &&
        inputs.checkpoint_run_id != '' &&
        inputs.checkpoint_version != '' &&
        inputs.checkpoint_consumer_stage != '' &&
        inputs.checkpoint_artifact_stage != ''
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Provenance-check and validate production checkpoint bytes
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKPOINT_RUN_ID: ${{ inputs.checkpoint_run_id }}
          CHECKPOINT_VERSION: ${{ inputs.checkpoint_version }}
          CHECKPOINT_CONSUMER_STAGE: ${{ inputs.checkpoint_consumer_stage }}
          CHECKPOINT_ARTIFACT_STAGE: ${{ inputs.checkpoint_artifact_stage }}
          CHECKPOINT_EXPECTED_REF: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${CHECKPOINT_RUN_ID}" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "${CHECKPOINT_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "${CHECKPOINT_CONSUMER_STAGE}" =~ ^[1-9][0-9]?$ ]]
          [ "${CHECKPOINT_CONSUMER_STAGE}" -le 50 ]
          [[ "${CHECKPOINT_ARTIFACT_STAGE}" =~ ^[1-9][0-9]?$ ]]
          [ "${CHECKPOINT_ARTIFACT_STAGE}" -le 50 ]
          command -v gh >/dev/null
          command -v jq >/dev/null
          command -v zstd >/dev/null

          source .github/scripts/chromium_i686_common.sh
          source .github/scripts/chromium_i686_resume.sh
          artifact_name="chromium-i686-out-stage-${CHECKPOINT_ARTIFACT_STAGE}"
          validate_checkpoint_source_run \
            "${CHECKPOINT_RUN_ID}" \
            "${CHECKPOINT_VERSION}" \
            "${CHECKPOINT_CONSUMER_STAGE}" \
            "${artifact_name}"
          test "${CHECKPOINT_PROVENANCE_STATUS}" = usable
          trusted_sha="${CHECKPOINT_PRODUCER_SHA}"

          proof_dir="${RUNNER_TEMP}/checkpoint-proof"
          bounded_rm_rf "${proof_dir}" || true
          mkdir -p "${proof_dir}"
          bounded_gh run download "${CHECKPOINT_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "${artifact_name}" \
            --dir "${proof_dir}"

          archive="${proof_dir}/out-Release_x86.tar.zst"
          checksum="${proof_dir}/out-Release_x86.tar.zst.sha256"
          manifest="${proof_dir}/checkpoint-manifest.json"
          test -s "${archive}"
          test -s "${checksum}"
          test -s "${manifest}"
          (
            cd "${proof_dir}"
            sha256sum -c "$(basename "${checksum}")"
          )
          python3 scripts/validate_checkpoint_archive.py \
            "${archive}" --stats-file "${proof_dir}/checkpoint-archive-stats.json"
          jq -e \
            --arg version "${CHECKPOINT_VERSION}" \
            --arg sha "${trusted_sha}" \
            --argjson stage "${CHECKPOINT_ARTIFACT_STAGE}" \
            '.schema_version == 1 and
             .chromium_version == $version and
             .checkpoint_stage == $stage and
             .target_os == "linux" and
             .target_cpu == "x86" and
             ((.workflow_sha // "") | ascii_downcase) == ($sha | ascii_downcase)' \
            "${manifest}" >/dev/null
          jq -e \
            --arg run_id "${CHECKPOINT_RUN_ID}" \
            '(.producer_run_id // $run_id | tostring) == $run_id' \
            "${manifest}" >/dev/null
          cat "${proof_dir}/checkpoint-archive-stats.json"
          echo "Production checkpoint recovery drill passed for ${artifact_name} from run ${CHECKPOINT_RUN_ID}."

  validate_real_release_runtime:
    name: Validate real published i686 runtime
    needs: resolve_production_runner
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_smoke_version != '' && needs.resolve_production_runner.result == 'success' }}
    runs-on: ${{ needs.resolve_production_runner.outputs.label }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout trusted runtime validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download, verify and launch immutable release bytes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SMOKE_VERSION: ${{ inputs.release_smoke_version }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${RELEASE_SMOKE_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::release_smoke_version must use the form 151.0.7922.75"
            exit 1
          }
          source .github/scripts/chromium_i686_common.sh
          install_i386_runtime_libraries
          bounded_sudo_apt_get install -y --no-install-recommends file binutils xz-utils

          tag="chromium-${RELEASE_SMOKE_VERSION}-linux-i686"
          package_name="chromium-${RELEASE_SMOKE_VERSION}-linux-i686.tar.xz"
          checksum_name="${package_name}.sha256"
          release_json="$(bounded_gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" --json tagName,isDraft,isPrerelease,assets)"
          test "$(jq -r '.tagName' <<<"${release_json}")" = "${tag}"
          test "$(jq -r '.isDraft' <<<"${release_json}")" = false
          test "$(jq -r '.isPrerelease' <<<"${release_json}")" = false
          test "$(jq -r --arg name "${package_name}" '[.assets[] | select(.name == $name)] | length' <<<"${release_json}")" -eq 1
          test "$(jq -r --arg name "${checksum_name}" '[.assets[] | select(.name == $name)] | length' <<<"${release_json}")" -eq 1

          proof_dir="${RUNNER_TEMP}/release-runtime-proof"
          bounded_rm_rf "${proof_dir}" || true
          mkdir -p "${proof_dir}"
          bounded_gh release download "${tag}" --repo "${GITHUB_REPOSITORY}" --pattern "${package_name}" --dir "${proof_dir}"
          bounded_gh release download "${tag}" --repo "${GITHUB_REPOSITORY}" --pattern "${checksum_name}" --dir "${proof_dir}"
          test "$(awk 'NF {count++} END {print count + 0}' "${proof_dir}/${checksum_name}")" -eq 1
          listed_sha="$(awk 'NR == 1 {print $1}' "${proof_dir}/${checksum_name}")"
          [[ "${listed_sha}" =~ ^[0-9a-fA-F]{64}$ ]] || {
            echo "::error::Published checksum asset does not begin with a SHA-256 digest."
            exit 1
          }
          package_sha="$(sha256sum "${proof_dir}/${package_name}" | awk '{print $1}')"
          checksum_asset_sha="$(sha256sum "${proof_dir}/${checksum_name}" | awk '{print $1}')"
          test "${package_sha}" = "${listed_sha,,}"
          remote_digest="$(jq -er --arg name "${package_name}" '.assets[] | select(.name == $name) | .digest' <<<"${release_json}")"
          remote_checksum_digest="$(jq -er --arg name "${checksum_name}" '.assets[] | select(.name == $name) | .digest' <<<"${release_json}")"
          test "${remote_digest}" = "sha256:${package_sha}"
          test "${remote_checksum_digest}" = "sha256:${checksum_asset_sha}"
          release_stats="${proof_dir}/release-archive-stats.json"
          validate_release_archive_with_stats "${proof_dir}/${package_name}" "${release_stats}"

          runtime_dir="${proof_dir}/runtime"
          mkdir -p "${runtime_dir}"
          ensure_release_archive_extract_space "${release_stats}" "${runtime_dir}"
          bounded_external "${CHROMIUM_I686_ARCHIVE_TIMEOUT_SECONDS}" \
            tar -xJf "${proof_dir}/${package_name}" -C "${runtime_dir}"
          validate_i686_runtime_bundle "${runtime_dir}"
          smoke_test_i686_runtime_bundle "${runtime_dir}" "${RELEASE_SMOKE_VERSION}"
          echo "Real published Chromium ${RELEASE_SMOKE_VERSION} i686 runtime smoke passed."

  validate_full_source_preflight:
    name: Full Chromium i686 compatibility proof
    needs: resolve_production_runner
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_version != '' && needs.resolve_production_runner.result == 'success' }}
    runs-on: ${{ needs.resolve_production_runner.outputs.label }}
    timeout-minutes: 120
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CHROMIUM_VERSION: ${{ inputs.full_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate full source, pinned tools and i686 graph
        shell: bash
        run: |
          set -euo pipefail
          [[ "${CHROMIUM_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]
          source .github/scripts/chromium_i686_common.sh
          source .github/scripts/chromium_i686_port.sh
          maximize_runner_disk_space
          install_system_dependencies
          install_i386_runtime_libraries
          prepare_chromium_source "${CHROMIUM_VERSION}"
          install_depot_tools
          install_chromium_clang
          install_i386_sysroot
          apply_i686_port_patches "${CHROMIUM_VERSION}"
          write_lastchange
          configure_ccache
          install_gn_from_cipd
          configure_gn
          run_i686_compatibility_preflight
          run_extended_i686_preflight

      - name: Upload full-preflight evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chromium-${{ inputs.full_version }}-linux-i686-full-preflight
          path: i686-preflight-ninja-query.txt
          retention-days: 14
          if-no-files-found: error

  validate_i386_runtime:
    name: Validate i386 host runtime
    needs: resolve_production_runner
    if: ${{ needs.resolve_production_runner.result == 'success' }}
    runs-on: ${{ needs.resolve_production_runner.outputs.label }}
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install and verify i386 runtime
        shell: bash
        run: |
          set -euo pipefail
          source .github/scripts/chromium_i686_common.sh
          install_i386_runtime_libraries
          bounded_sudo_apt_get install -y --no-install-recommends gcc-multilib file binutils

          resolve_i386_package_for_soname libQt5Core.so.5
          test "${I386_RESOLVED_PACKAGE}" = libqt5core5a:i386
          resolve_i386_package_for_soname libQt5Gui.so.5
          test "${I386_RESOLVED_PACKAGE}" = libqt5gui5:i386
          resolve_i386_package_for_soname libQt5Widgets.so.5
          test "${I386_RESOLVED_PACKAGE}" = libqt5widgets5:i386
          bounded_sudo_apt_get install -y --no-install-recommends libqt5widgets5:i386
          test -e /usr/lib/i386-linux-gnu/libQt5Core.so.5
          test -e /usr/lib/i386-linux-gnu/libQt5Gui.so.5
          test -e /usr/lib/i386-linux-gnu/libQt5Widgets.so.5

          # Exercise generic SONAME-derived discovery with a library deliberately
          # absent from I386_SONAME_PACKAGES. It must resolve without Contents indexes.
          resolve_i386_package_for_soname libQt5Network.so.5
          test "${I386_RESOLVED_PACKAGE}" = libqt5network5:i386
          test ! -e "${RUNNER_TEMP}/chromium-i686-apt-file-i386-ready"

          cat > "${RUNNER_TEMP}/i386-canary.c" <<'EOF'
          #include <stdio.h>
          int main(void) {
            puts("i386 runtime canary ok");
            return 0;
          }
          EOF
          gcc -m32 "${RUNNER_TEMP}/i386-canary.c" -o "${RUNNER_TEMP}/i386-canary"
          file "${RUNNER_TEMP}/i386-canary"
          readelf -h "${RUNNER_TEMP}/i386-canary"
          ldd_output="$(ldd "${RUNNER_TEMP}/i386-canary")"
          printf '%s\n' "${ldd_output}"
          if grep -q 'not found' <<<"${ldd_output}"; then
            echo "::error::i386 runtime canary has unresolved runtime dependencies."
            exit 1
          fi
          "${RUNNER_TEMP}/i386-canary"

  validate_lts_compatibility:
    name: LTS i386 compatibility (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            experimental: false
          - runner: ubuntu-24.04
            experimental: false
          - runner: ubuntu-latest
            experimental: false
          - runner: ubuntu-26.04
            experimental: true
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.experimental }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Probe release-local i386 runtime
        shell: bash
        run: |
          set -euo pipefail
          source .github/scripts/chromium_i686_common.sh
          maximize_runner_disk_space
          install_system_dependencies
          VERSION="151.0.7922.108"
          version_sentinel="${VERSION}"
          install_i386_runtime_libraries
          test "${VERSION}" = "${version_sentinel}"

          # These are direct DT_NEEDED dependencies observed on the packaged Chromium
          # browser. Every supported LTS image must resolve them from normal package
          # metadata; apt-file Contents is reserved for genuinely unknown future SONAMEs.
          ensure_apt_file_i386_metadata() {
            echo "::error::Standard Chromium runtime mapping unexpectedly required apt-file metadata: $*"
            return 1
          }
          for soname in \
            libatk-1.0.so.0 libatk-bridge-2.0.so.0 libatspi.so.0 libcups.so.2 \
            libcairo.so.2 libpango-1.0.so.0 libXcomposite.so.1 libXdamage.so.1 \
            libXfixes.so.3 libXrandr.so.2 libXtst.so.6; do
            resolve_i386_package_for_soname "${soname}"
            test -n "${I386_RESOLVED_PACKAGE}"
          done

          bounded_sudo_apt_get install -y --no-install-recommends gcc-multilib file binutils

          cat > "${RUNNER_TEMP}/lts-i386-canary.c" <<'EOF'
          #include <stdio.h>
          int main(void) {
            puts("lts i386 compatibility ok");
            return 0;
          }
          EOF
          gcc -m32 "${RUNNER_TEMP}/lts-i386-canary.c" -o "${RUNNER_TEMP}/lts-i386-canary"
          is_i386_host_executable "${RUNNER_TEMP}/lts-i386-canary"
          ldd_output="$(ldd "${RUNNER_TEMP}/lts-i386-canary")"
          printf '%s\n' "${ldd_output}"
          if grep -q 'not found' <<<"${ldd_output}"; then
            echo "::error::LTS i386 canary has unresolved runtime dependencies."
            exit 1
          fi
          "${RUNNER_TEMP}/lts-i386-canary"

      - name: Assert shared objects are not host executables
        shell: bash
        run: |
          set -euo pipefail
          source .github/scripts/chromium_i686_common.sh
          cat > "${RUNNER_TEMP}/shared.c" <<'EOF'
          int chromium_i686_shared_probe(void) { return 42; }
          EOF
          gcc -m32 -shared -fPIC "${RUNNER_TEMP}/shared.c" -o "${RUNNER_TEMP}/libshared-probe.so"
          file "${RUNNER_TEMP}/libshared-probe.so"
          if is_i386_host_executable "${RUNNER_TEMP}/libshared-probe.so"; then
            echo "::error::ELF32 shared object was incorrectly classified as a host build executable."
            exit 1
          fi

  report_upstream_contract_drift:
    name: Report Chromium source-contract drift
    needs: validate_upstream_contract
    if: ${{ always() && github.event_name == 'schedule' && needs.validate_upstream_contract.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout maintenance helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Open or update source-contract issue
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          title='[i686-port] Chromium source/tool contract drift'
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body_file="${RUNNER_TEMP}/chromium-source-contract-drift.md"
          cat > "${body_file}" <<EOF
          The scheduled latest-Chromium source contract probe failed. Chromium may have changed DEPS tool pins, Linux installer definitions, or upstream hosting.

          Review ${run_url} before the next production version.
          EOF
          python3 scripts/github_maintenance_issue.py \
            --repository "${GITHUB_REPOSITORY}" \
            --title "${title}" \
            --body-file "${body_file}"

  close_upstream_contract_drift:
    name: Close resolved Chromium source-contract drift
    needs: validate_upstream_contract
    if: >-
      ${{
        always() &&
        needs.validate_upstream_contract.result == 'success' &&
        (
          github.event_name == 'schedule' ||
          (github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch)
        )
      }}
    continue-on-error: true
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted maintenance helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Close resolved source-contract issue
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/github_maintenance_issue.py \
            --repository "${GITHUB_REPOSITORY}" \
            --title "[i686-port] Chromium source/tool contract drift" \
            --close-if-open

  report_runner_configuration:
    name: Report invalid production runner configuration
    needs: resolve_production_runner
    if: >-
      ${{
        always() &&
        needs.resolve_production_runner.result == 'failure' &&
        (
          github.event_name == 'schedule' ||
          (github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch)
        )
      }}
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted maintenance helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Record invalid runner configuration
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RUNNER: ${{ vars.CHROMIUM_I686_RUNNER || 'ubuntu-24.04' }}
        shell: bash
        run: |
          set -euo pipefail
          body_file="${RUNNER_TEMP}/invalid-i686-runner.md"
          cat > "${body_file}" <<EOF
          The Chromium i686 validation workflow rejected the configured production runner before scheduling any heavyweight runner-dependent validation.

          - Requested runner: ${REQUESTED_RUNNER}
          - Allowed explicit production labels: ubuntu-22.04, ubuntu-24.04
          - `ubuntu-latest` remains matrix-only.
          - Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          python3 scripts/github_maintenance_issue.py \
            --repository "${GITHUB_REPOSITORY}" \
            --title "[i686-port] Ubuntu LTS compatibility drift" \
            --body-file "${body_file}"

  close_lts_drift:
    name: Close resolved Ubuntu LTS compatibility drift
    needs: [resolve_production_runner, validate_lts_compatibility]
    if: >-
      ${{
        always() &&
        needs.resolve_production_runner.result == 'success' &&
        needs.validate_lts_compatibility.result == 'success' &&
        (
          github.event_name == 'schedule' ||
          (github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch)
        )
      }}
    continue-on-error: true
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted maintenance helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Close resolved LTS compatibility issue
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/github_maintenance_issue.py \
            --repository "${GITHUB_REPOSITORY}" \
            --title "[i686-port] Ubuntu LTS compatibility drift" \
            --close-if-open

  report_lts_drift:
    name: Report Ubuntu LTS compatibility drift
    needs: validate_lts_compatibility
    if: ${{ always() && github.event_name == 'schedule' && needs.validate_lts_compatibility.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout maintenance helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Open or update LTS compatibility issue
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          title='[i686-port] Ubuntu LTS compatibility drift'
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body_file="${RUNNER_TEMP}/ubuntu-lts-compatibility-drift.md"
          cat > "${body_file}" <<EOF
          The scheduled Ubuntu LTS compatibility matrix failed.

          Review ${run_url} before changing CHROMIUM_I686_RUNNER or relying on a newer GitHub-hosted image.
          EOF
          python3 scripts/github_maintenance_issue.py \
            --repository "${GITHUB_REPOSITORY}" \
            --title "${title}" \
            --body-file "${body_file}"
