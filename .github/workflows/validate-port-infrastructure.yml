name: Validate i686 Port Infrastructure

on:
  pull_request:
    paths:
      - ".github/**"
      - "docs/MAINTENANCE.md"
      - "patches/**"
      - "scripts/**"
      - "support/**"
      - "tests/**"
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Python and unit tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q scripts patches tests
          python3 -m unittest discover -s tests -v
          python3 -m json.tool support/baseline.json >/dev/null

      - name: Validate shell helpers
        shell: bash
        run: |
          set -euo pipefail
          for script in .github/scripts/*.sh; do
            bash -n "${script}"
          done

      - name: Exercise i386 runtime repair contract
        shell: bash
        run: |
          set -euo pipefail
          bash tests/test_i386_runtime_repair.sh

      - name: Reject floating first-party action tags
        shell: bash
        run: |
          set -euo pipefail
          invalid_refs="$(grep -R -nE 'uses:[[:space:]]+actions/[^@]+@[^[:space:]#]+' .github \
            | grep -Ev 'uses:[[:space:]]+actions/[^@]+@[0-9a-f]{40}([[:space:]]*#.*)?$' || true)"
          if [ -n "${invalid_refs}" ]; then
            printf '%s\n' "${invalid_refs}"
            echo "::error::First-party GitHub Actions must be pinned to exact 40-character commit SHAs."
            exit 1
          fi

      - name: Smoke-test failure classification
        shell: bash
        run: |
          set -euo pipefail
          source .github/scripts/chromium_i686_common.sh
          temp="$(mktemp -d)"
          trap 'rm -rf "${temp}"' EXIT
          echo 'error while loading shared libraries: libfuture.so: cannot open shared object file' > "${temp}/runtime.log"
          echo 'fatal error: no member named future_api' > "${temp}/deterministic.log"
          echo 'No space left on device' > "${temp}/infrastructure.log"
          test "$(classify_build_failure "${temp}/runtime.log")" = runtime_environment
          test "$(classify_build_failure "${temp}/deterministic.log")" = deterministic_build
          test "$(classify_build_failure "${temp}/infrastructure.log")" = infrastructure

      - name: Smoke-test semantic patch
        shell: bash
        run: |
          set -euo pipefail
          temp="$(mktemp -d)"
          trap 'rm -rf "${temp}"' EXIT
          cat > "${temp}/BUILD.gn" <<'EOF'
          assert(
            is_valid_x86_target || target_cpu != "x86" || v8_target_cpu == "arm",
            "unsupported",
          )
          EOF
          mkdir -p "${temp}/tools/metrics"
          cat > "${temp}/tools/metrics/BUILD.gn" <<'EOF'
          if (path_exists("//.git")) {
            action("histograms_xml") {
            }
          }
          group("metrics_metadata") {
            if (generate_location_tags) {
              deps += [ ":histograms_xml" ]
            }
          }
          EOF
          python3 patches/common/enable_linux_i686.py \
            --source-root "${temp}" \
            --version 150.0.7871.186
          grep -q 'target_os == "linux"' "${temp}/BUILD.gn"
          grep -q 'if (path_exists("//.git"))' "${temp}/tools/metrics/BUILD.gn"
          ! grep -q 'if (generate_location_tags)' "${temp}/tools/metrics/BUILD.gn"


  validate_i386_runtime:
    name: Validate i386 host runtime
    runs-on: ${{ vars.CHROMIUM_I686_RUNNER || 'ubuntu-22.04' }}
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install and verify i386 runtime
        shell: bash
        run: |
          set -euo pipefail
          source .github/scripts/chromium_i686_common.sh
          install_i386_runtime_libraries
          bounded_sudo_apt_get install -y --no-install-recommends gcc-multilib file binutils

          resolve_i386_package_for_soname libQt5Core.so.5
          test "${I386_RESOLVED_PACKAGE}" = libqt5core5a:i386
          resolve_i386_package_for_soname libQt5Gui.so.5
          test "${I386_RESOLVED_PACKAGE}" = libqt5gui5:i386
          resolve_i386_package_for_soname libQt5Widgets.so.5
          test "${I386_RESOLVED_PACKAGE}" = libqt5widgets5:i386
          bounded_sudo_apt_get install -y --no-install-recommends libqt5widgets5:i386
          test -e /usr/lib/i386-linux-gnu/libQt5Core.so.5
          test -e /usr/lib/i386-linux-gnu/libQt5Gui.so.5
          test -e /usr/lib/i386-linux-gnu/libQt5Widgets.so.5

          # Exercise generic SONAME-derived discovery with a library deliberately
          # absent from I386_SONAME_PACKAGES. It must resolve without Contents indexes.
          resolve_i386_package_for_soname libQt5Network.so.5
          test "${I386_RESOLVED_PACKAGE}" = libqt5network5:i386
          test ! -e "${RUNNER_TEMP}/chromium-i686-apt-file-i386-ready"

          cat > "${RUNNER_TEMP}/i386-canary.c" <<'EOF'
          #include <stdio.h>
          int main(void) {
            puts("i386 runtime canary ok");
            return 0;
          }
          EOF
          gcc -m32 "${RUNNER_TEMP}/i386-canary.c" -o "${RUNNER_TEMP}/i386-canary"
          file "${RUNNER_TEMP}/i386-canary"
          readelf -h "${RUNNER_TEMP}/i386-canary"
          ldd_output="$(ldd "${RUNNER_TEMP}/i386-canary")"
          printf '%s\n' "${ldd_output}"
          if grep -q 'not found' <<<"${ldd_output}"; then
            echo "::error::i386 runtime canary has unresolved runtime dependencies."
            exit 1
          fi
          "${RUNNER_TEMP}/i386-canary"

  validate_lts_compatibility:
    name: LTS i386 compatibility (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-22.04
          - ubuntu-24.04
          - ubuntu-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Probe release-local i386 runtime
        shell: bash
        run: |
          set -euo pipefail
          source .github/scripts/chromium_i686_common.sh
          install_i386_runtime_libraries
          bounded_sudo_apt_get install -y --no-install-recommends gcc-multilib file binutils

          cat > "${RUNNER_TEMP}/lts-i386-canary.c" <<'EOF'
          #include <stdio.h>
          int main(void) {
            puts("lts i386 compatibility ok");
            return 0;
          }
          EOF
          gcc -m32 "${RUNNER_TEMP}/lts-i386-canary.c" -o "${RUNNER_TEMP}/lts-i386-canary"
          is_i386_host_executable "${RUNNER_TEMP}/lts-i386-canary"
          ldd_output="$(ldd "${RUNNER_TEMP}/lts-i386-canary")"
          printf '%s\n' "${ldd_output}"
          if grep -q 'not found' <<<"${ldd_output}"; then
            echo "::error::LTS i386 canary has unresolved runtime dependencies."
            exit 1
          fi
          "${RUNNER_TEMP}/lts-i386-canary"

      - name: Assert shared objects are not host executables
        shell: bash
        run: |
          set -euo pipefail
          source .github/scripts/chromium_i686_common.sh
          cat > "${RUNNER_TEMP}/shared.c" <<'EOF'
          int chromium_i686_shared_probe(void) { return 42; }
          EOF
          gcc -m32 -shared -fPIC "${RUNNER_TEMP}/shared.c" -o "${RUNNER_TEMP}/libshared-probe.so"
          file "${RUNNER_TEMP}/libshared-probe.so"
          if is_i386_host_executable "${RUNNER_TEMP}/libshared-probe.so"; then
            echo "::error::ELF32 shared object was incorrectly classified as a host build executable."
            exit 1
          fi

  report_lts_drift:
    name: Report Ubuntu LTS compatibility drift
    needs: validate_lts_compatibility
    if: ${{ always() && github.event_name == 'schedule' && needs.validate_lts_compatibility.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update LTS compatibility issue
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          title='[i686-port] Ubuntu LTS compatibility drift'
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body="The scheduled Ubuntu LTS compatibility matrix failed. Review ${run_url} before changing CHROMIUM_I686_RUNNER or relying on a newer GitHub-hosted image."
          issue_number="$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open --json number,title --jq '.[] | select(.title == "[i686-port] Ubuntu LTS compatibility drift") | .number' | head -n1)"
          if [ -n "${issue_number}" ]; then
            gh issue comment "${issue_number}" --repo "${GITHUB_REPOSITORY}" --body "${body}"
          else
            gh issue create --repo "${GITHUB_REPOSITORY}" --title "${title}" --body "${body}"
          fi
