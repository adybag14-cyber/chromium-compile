name: Bootstrap Chromium i686 Live Build

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.ref_name == github.event.repository.default_branch && 'chromium-i686-bootstrap' || format('chromium-i686-bootstrap-nonprod-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  dispatch:
    if: ${{ github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout bootstrap helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Dispatch or record the baseline exactly once
        env:
          GH_TOKEN: ${{ github.token }}
          CHROMIUM_VERSION: "150.0.7871.186"
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        shell: bash
        run: |
          set -euo pipefail
          tag="chromium-${CHROMIUM_VERSION}-linux-i686"
          released=false
          dispatched=false

          release_state="$(python3 scripts/github_release_state.py \
            --repository "${GITHUB_REPOSITORY}" --tag "${tag}")"
          if [ "${release_state}" = "exists" ]; then
            released=true
            echo "${tag} already exists; bootstrap will never redispatch a released baseline."
          elif [ "${release_state}" = "missing" ]; then
            expected_title="Chromium i686 preflight ${CHROMIUM_VERSION}"
            result="$(python3 scripts/github_workflow_dispatch.py \
              --repository "${GITHUB_REPOSITORY}" \
              --workflow chromium-i686-preflight.yml \
              --ref "${DEFAULT_BRANCH}" \
              --expected-title "${expected_title}" \
              --expected-head-sha "${WORKFLOW_SHA}" \
              --input "version=${CHROMIUM_VERSION}" \
              --input "dispatch_build=true")"
            if [ "${result}" != "already-active" ]; then
              dispatched=true
            fi
          else
            echo "::error::Unexpected release-state helper result: ${release_state}"
            exit 1
          fi

          run_json="$(timeout -k 10s 60s gh run list \
            --repo "${GITHUB_REPOSITORY}" \
            --workflow chromium-i686-preflight.yml \
            --limit 100 \
            --json displayTitle,status,conclusion,createdAt,url \
            | jq -c --arg title "Chromium i686 preflight ${CHROMIUM_VERSION}" \
                '[.[] | select(.displayTitle == $title)] | first // {displayTitle:"not visible",status:"unknown",conclusion:null,createdAt:null,url:null}')"

          jq -n \
            --arg version "${CHROMIUM_VERSION}" \
            --argjson released "${released}" \
            --argjson dispatched "${dispatched}" \
            --arg timestamp "$(date --iso-8601=seconds)" \
            --argjson run "${run_json}" \
            '{schema:2,version:$version,release_exists:$released,dispatched_by_this_run:$dispatched,recorded_at:$timestamp,preflight:$run}' \
            > bootstrap-status.json

          {
            echo "## Chromium i686 bootstrap status"
            echo '```json'
            cat bootstrap-status.json
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
