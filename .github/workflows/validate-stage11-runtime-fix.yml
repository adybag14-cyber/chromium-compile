name: Validate Stage 11 i386 Runtime Fix

on:
  push:
    branches:
      - fix/ninja-checkpoint-resume

permissions:
  contents: write
  actions: read

env:
  JOB_CHECKPOINT_MINUTES: "350"
  CHECKPOINT_RETENTION_DAYS: "14"
  CCACHE_MAX_SIZE: 8G
  CCACHE_DIR: ${{ github.workspace }}/.ccache

jobs:
  validate_stage_11:
    if: ${{ contains(github.event.head_commit.message, '[validate-stage11]') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout Fix Branch
        uses: actions/checkout@v4

      - name: Resume Stage 11 From Latest Checkpoint
        id: compiler
        uses: ./.github/actions/chromium-i686-stage
        with:
          stage: "11"
          attempt: "runtime-fix-validation-2"
          version: "150.0.7871.186"
          preferred-checkpoint-artifact: "chromium-i686-out-stage-11"
          preferred-checkpoint-run-id: "30354029448"
          fallback-checkpoint-artifact: ""
          fallback-checkpoint-run-id: ""
          final-stage: "false"
