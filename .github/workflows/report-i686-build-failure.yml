name: Report Chromium i686 Port Failure
run-name: Report ${{ github.event.workflow_run.display_title }}

on:
  workflow_run:
    workflows:
      - Chromium i686 Compatibility Preflight
      - Chromium i686 Build (Unofficial Port)
    types:
      - completed

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  report:
    if: >-
      ${{
        github.event.workflow_run.conclusion != 'success' &&
        github.event.workflow_run.head_branch == github.event.repository.default_branch &&
        github.event.workflow_run.head_repository.full_name == github.repository
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Open or update maintenance issue
        env:
          GH_TOKEN: ${{ github.token }}
          DISPLAY_TITLE: ${{ github.event.workflow_run.display_title }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' <<<"${DISPLAY_TITLE}" | head -n1 || true)"
          if [ "${WORKFLOW_NAME}" = "Chromium i686 Build (Unofficial Port)" ]; then
            recovery_conclusion="$(
              gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?filter=latest&per_page=100" \
                --jq '.jobs[] | select(.name == "Recover stage on a fresh runner") | .conclusion' \
                | tail -n1
            )"
            if [ "${recovery_conclusion}" = "success" ]; then
              echo "A fresh-runner recovery was dispatched successfully; deferring maintenance issue."
              exit 0
            fi
          fi
          if [ -z "${version}" ]; then
            echo "::error::Could not extract a Chromium version from: ${DISPLAY_TITLE}"
            exit 1
          fi

          log_excerpt="$(gh run view "${RUN_ID}" --repo "${GITHUB_REPOSITORY}" --log-failed 2>&1 | tail -n 80 || true)"
          title="[i686-port] Chromium ${version} requires maintenance"
          body_file="${RUNNER_TEMP}/i686-port-failure.md"
          cat > "${body_file}" <<EOF
          Chromium ${version} did not complete the unofficial Linux i686 port pipeline.

          - Workflow: ${WORKFLOW_NAME}
          - Conclusion: ${CONCLUSION}
          - Run: ${RUN_URL}
          - Source commit: \`${HEAD_SHA}\`

          The stable watcher will treat this open issue as a maintenance block and will not repeatedly dispatch the same version. Close the issue when the compatibility fix is ready for another attempt.

          <details>
          <summary>Failed log excerpt</summary>

          \`\`\`text
          ${log_excerpt}
          \`\`\`
          </details>
          EOF

          issue_number="$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open --json number,title --jq ".[] | select(.title == \"${title}\") | .number" | head -n1)"
          if [ -n "${issue_number}" ]; then
            gh issue comment "${issue_number}" --repo "${GITHUB_REPOSITORY}" --body-file "${body_file}"
          else
            gh issue create --repo "${GITHUB_REPOSITORY}" --title "${title}" --body-file "${body_file}"
          fi
