name: Report Chromium i686 Port Failure
run-name: Report ${{ github.event.workflow_run.display_title }}

on:
  workflow_run:
    workflows:
      - Chromium i686 Compatibility Preflight
      - Chromium i686 Build (Unofficial Port)
      - Publish Chromium i686 Release
    types:
      - completed

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: chromium-i686-maintenance-issues
  cancel-in-progress: false

jobs:
  report:
    if: >-
      ${{
        github.event.workflow_run.conclusion != 'success' &&
        github.event.workflow_run.conclusion != 'skipped' &&
        github.event.workflow_run.head_branch == github.event.repository.default_branch &&
        github.event.workflow_run.head_repository.full_name == github.repository
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout maintenance helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Open or update maintenance issue
        env:
          GH_TOKEN: ${{ github.token }}
          DISPLAY_TITLE: ${{ github.event.workflow_run.display_title }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' <<<"${DISPLAY_TITLE}" | head -n1 || true)"
          if [ -n "${version}" ]; then
            title="[i686-port] Chromium ${version} requires maintenance"
            subject="Chromium ${version}"
          else
            echo "::warning::Could not extract a Chromium version from ${DISPLAY_TITLE}; using the generic pipeline maintenance record."
            title="[i686-port] Chromium pipeline requires maintenance"
            subject="A Chromium i686 pipeline run with an unparseable version"
          fi

          if [ "${WORKFLOW_NAME}" = "Chromium i686 Build (Unofficial Port)" ]; then
            recovery_conclusion="$(timeout -k 10s 60s gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?filter=latest&per_page=100" \
              --jq '.jobs[] | select(.name == "Recover stage on a fresh runner") | .conclusion' \
              | tail -n1 || true)"
            if [ "${recovery_conclusion}" = "success" ]; then
              echo "A fresh-runner recovery was dispatched successfully; terminal issue is deferred."
              exit 0
            fi
          fi

          log_excerpt="$(timeout -k 10s 90s gh run view "${RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" --log-failed 2>&1 | tail -n 80 || true)"
          body_file="${RUNNER_TEMP}/i686-port-failure.md"
          cat > "${body_file}" <<EOF
          ${subject} did not complete the unofficial Linux i686 port pipeline.

          - Workflow: ${WORKFLOW_NAME}
          - Conclusion: ${CONCLUSION}
          - Run: ${RUN_URL}
          - Source commit: ${HEAD_SHA}

          Same-run failure reporters and recent terminal Actions history independently quarantine this version. This secondary workflow mirrors the failure for human maintenance tracking.

          <details>
          <summary>Failed log excerpt</summary>

          \`\`\`text
          ${log_excerpt}
          \`\`\`
          </details>
          EOF

          python3 scripts/github_maintenance_issue.py \
            --repository "${GITHUB_REPOSITORY}" \
            --title "${title}" \
            --body-file "${body_file}"
